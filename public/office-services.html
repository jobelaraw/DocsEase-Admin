<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaBayan – Office Services</title>
  <link rel="icon" type="image/png" href="assets/logo_whitebg.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/shell.js"></script>
  <script type="module" src="js/pages/office-services.js"></script>
</head>
<body>
  <app-sidebar active="services"></app-sidebar>

  <main class="main main--fixed">
    <app-topbar back="service-management.html" back-role="super_admin"></app-topbar>

    <div class="content">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="page-title">Services</h1>
          <p class="page-subtitle" id="page-subtitle">Monitor and manage service items.</p>
        </div>
      </div>

      <div class="toolbar">
        <label class="search-box">
          <img src="assets/search.svg" alt="" />
          <input type="search" id="search" placeholder="Search service..." aria-label="Search services" />
        </label>
        <a class="btn btn-cta" id="add-service" href="service-form.html">
          <img src="assets/add_service.svg" alt="" />
          <span>Add New Service</span>
        </a>
      </div>

      <section class="panel-card" aria-labelledby="page-title">
        <div class="panel-scroll">
          <div class="tile-grid" id="services" aria-busy="true"></div>
          <p class="empty-state" id="status" hidden></p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
