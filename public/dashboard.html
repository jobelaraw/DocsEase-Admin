<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaBayan – Dashboard</title>
  <link rel="icon" type="image/png" href="assets/logo_whitebg.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/pages/dashboard.css" />
  <script src="js/shell.js"></script>
  <script type="module" src="js/pages/dashboard.js"></script>
</head>
<body>
  <app-sidebar active="dashboard"></app-sidebar>

  <main class="main">
    <app-topbar></app-topbar>

    <div class="content">
      <header class="banner">
        <div>
          <h1>Welcome Back, Admin!</h1>
          <p>Manage your municipal transactions, documents, and civic duties all in one secure place</p>
        </div>
        <div class="banner-datetime">
          <div class="date" id="banner-date"></div>
          <div class="time" id="banner-time"></div>
        </div>
      </header>

      <div class="dashboard-actions" id="actions"></div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><img src="assets/map_mngment.svg" alt="" /></div>
            <div class="stat-label">Total Offices</div>
          </div>
          <div class="stat-value" id="stat-offices"><span class="skel skel-inline" style="width:72px;height:34px" aria-hidden="true"></span></div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><img src="assets/total_completed.svg" alt="" /></div>
            <div class="stat-label">Total Services</div>
          </div>
          <div class="stat-value" id="stat-services"><span class="skel skel-inline" style="width:72px;height:34px" aria-hidden="true"></span></div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><img src="assets/total_users.svg" alt="" /></div>
            <div class="stat-label">Total Users</div>
          </div>
          <div class="stat-value" id="stat-users"><span class="skel skel-inline" style="width:72px;height:34px" aria-hidden="true"></span></div>
        </div>
      </div>

      <div class="card-grid">
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Most Used Services</h2>
            <a href="analytics.html" class="card-link">View Analytics →</a>
          </div>
          <div class="rank-list" id="most-used" aria-busy="true"></div>
        </section>

        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Completion Trend</h2>
            <a href="analytics.html" class="card-link">View Analytics →</a>
          </div>
          <div class="chart-wrap">
            <canvas id="trend-chart" aria-label="Completed and in-progress services per month"></canvas>
            <span class="skel skel-fill" id="trend-skel" aria-hidden="true"></span>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
