  <div class="main">
    <header class="topbar" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div class="rq-banner-tabs">
        <button type="button" class="rq-maintab active" id="tab-pending" onclick="setMainTab('pending')">Pending Request <span class="rq-notif-badge rq-notif-badge--inline" id="rq-tab-badge" hidden></span></button>
        <button type="button" class="rq-maintab" id="tab-completed" onclick="setMainTab('completed')">Completed Request</button>
        <button type="button" class="rq-maintab" id="tab-deleted" onclick="setMainTab('deleted')">Deleted Records</button>
      </div>

      <div id="profile-placeholder"></div>
    </header>

    <div class="content page-fade" id="main-content">
      <div class="rq-banner">
        
        <div class="rq-banner-body">
          <div>
            <h1 id="rq-banner-title">Review Request</h1>
            <p id="rq-banner-sub">Manage request, accept or decline request admin.</p>
          </div>
          <div class="rq-date-filters" id="rq-date-filters">
            <button type="button" class="rq-datechip active" data-range="today" onclick="setDateFilter('today')">Today</button>
            <button type="button" class="rq-datechip" data-range="week" onclick="setDateFilter('week')">This Week</button>
            <button type="button" class="rq-datechip" data-range="earlier" onclick="setDateFilter('earlier')">Earlier</button>
          </div>
        </div>
      </div>

      <div class="rq-toolbar">
        <div class="search-input-wrapper">
          <div class="search-icon-embed">
            <img src="assets/search.svg" alt="Search icon" />
          </div>
          <input type="text" id="search-input" placeholder="Search requests..." aria-label="Search requests" autocomplete="off" />
        </div>

        <div class="rq-type-filters" id="rq-type-filters">
          <button type="button" class="rq-typechip active" data-type="all" onclick="setTypeFilter('all')">All</button>
          <button type="button" class="rq-typechip" data-type="new_admin" onclick="setTypeFilter('new_admin')">Pending Admin Account</button>
          <button type="button" class="rq-typechip" data-type="delete_admin" onclick="setTypeFilter('delete_admin')">Pending Admin Deleted Account</button>
          <button type="button" class="rq-typechip" data-type="delete_service" onclick="setTypeFilter('delete_service')">Pending Deleted Service</button>
        </div>
        <div class="rq-type-filters" id="rq-kind-filters" hidden>
          <button type="button" class="rq-typechip active" data-kind="all" onclick="setKindFilter('all')">All</button>
          <button type="button" class="rq-typechip" data-kind="office" onclick="setKindFilter('office')">Deleted Offices</button>
          <button type="button" class="rq-typechip" data-kind="service" onclick="setKindFilter('service')">Deleted Services</button>
        </div>
      </div>

      <div class="rq-grid" id="rq-grid" aria-busy="true">
        <div class="rq-card" aria-hidden="true">
          <div class="rq-card-top"><span class="skel skel-circle" style="width:40px;height:40px;"></span><div class="skel-stack" style="flex:1;gap:6px;"><span class="skel skel-text" style="width:55%;"></span><span class="skel skel-text" style="width:30%;height:10px;"></span></div><div class="skel-stack" style="align-items:flex-end;gap:6px;"><span class="skel skel-text" style="width:64px;height:10px;"></span><span class="skel" style="width:90px;height:24px;border-radius:10px;"></span></div></div>
          <div class="skel-stack"><span class="skel skel-text"></span><span class="skel skel-text" style="width:85%;"></span><span class="skel skel-text" style="width:60%;"></span></div>
          <span class="skel" style="height:38px;border-radius:6px;"></span>
        </div>
        <div class="rq-card" aria-hidden="true">
          <div class="rq-card-top"><span class="skel skel-circle" style="width:40px;height:40px;"></span><div class="skel-stack" style="flex:1;gap:6px;"><span class="skel skel-text" style="width:55%;"></span><span class="skel skel-text" style="width:30%;height:10px;"></span></div><div class="skel-stack" style="align-items:flex-end;gap:6px;"><span class="skel skel-text" style="width:64px;height:10px;"></span><span class="skel" style="width:90px;height:24px;border-radius:10px;"></span></div></div>
          <div class="skel-stack"><span class="skel skel-text"></span><span class="skel skel-text" style="width:85%;"></span><span class="skel skel-text" style="width:60%;"></span></div>
          <span class="skel" style="height:38px;border-radius:6px;"></span>
        </div>
        <div class="rq-card" aria-hidden="true">
          <div class="rq-card-top"><span class="skel skel-circle" style="width:40px;height:40px;"></span><div class="skel-stack" style="flex:1;gap:6px;"><span class="skel skel-text" style="width:55%;"></span><span class="skel skel-text" style="width:30%;height:10px;"></span></div><div class="skel-stack" style="align-items:flex-end;gap:6px;"><span class="skel skel-text" style="width:64px;height:10px;"></span><span class="skel" style="width:90px;height:24px;border-radius:10px;"></span></div></div>
          <div class="skel-stack"><span class="skel skel-text"></span><span class="skel skel-text" style="width:85%;"></span><span class="skel skel-text" style="width:60%;"></span></div>
          <span class="skel" style="height:38px;border-radius:6px;"></span>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { collection, query, where, orderBy, onSnapshot, doc, getDoc, getDocs, deleteDoc, writeBatch, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { sendRegistrationEmail, sendRequestCompleted } from './js/email-service.js';
    
    // Activity log helper
    let _logActor = null;
    let _superAdminUids = null;

    async function getSuperAdminUids() {
      if (_superAdminUids) return _superAdminUids;
      try {
        const snap = await getDoc(doc(db, 'app_settings', 'super_admin'));
        _superAdminUids = snap.exists() ? (snap.data().uids || []) : [];
      } catch (err) {
        console.error('[activity-log] could not read super admin list:', err);
        return [];
      }
      return _superAdminUids;
    }

    async function logActivity(type, details = {}) {
      try {
        const user = auth.currentUser;
        if (!user) return;

        if (!_logActor || _logActor.uid !== user.uid) {
          let name = user.displayName || user.email || 'Admin';
          let role = 'admin';
          try {
            const snap = await getDoc(doc(db, 'admin', user.uid));
            if (snap.exists()) {
              const data = snap.data();
              name = data.full_name || name;
              role = data.role || 'admin';
            }
          } catch (err) {
            console.error('[activity-log] could not read actor profile:', err);
          }
          _logActor = { uid: user.uid, name, role };
        }

        const recipients = new Set(await getSuperAdminUids());
        if (details.recipient_uid === 'all_admins') {
          if (_logActor.role === 'super_admin') {
            const adminsSnap = await getDocs(query(collection(db, 'admin'), where('status', '==', 'active')));
            adminsSnap.forEach(d => recipients.add(d.id));
          }
        } else if (details.recipient_uid) {
          recipients.add(details.recipient_uid);
        }
        if (!recipients.size) return;

        const payload = {
          type,
          actor_uid: _logActor.uid,
          actor_name: details.actor_name || _logActor.name,
          actor_role: _logActor.role,
          office_name: details.office_name || '',
          service_name: details.service_name || '',
          target_name: details.target_name || '',
          target_uid: details.target_uid || '',
          createdAt: serverTimestamp()
        };

        const uids = [...recipients];
        for (let i = 0; i < uids.length; i += 400) {
          const batch = writeBatch(db);
          uids.slice(i, i + 400).forEach(uid => {
            batch.set(doc(collection(db, 'admin', uid, 'activity_logs')), payload);
          });
          await batch.commit();
        }
      } catch (err) {
        console.error('[activity-log] failed to log', type, err);
      }
    }

    // TODO: create this Cloud Function (like adminResetUserPassword, calling admin.auth().deleteUser(uid))
    const DELETE_AUTH_USER_ENDPOINT = 'https://us-central1-docsease-efacc.cloudfunctions.net/adminDeleteAuthUser';
    const FUNCTIONS_BASE = 'https://us-central1-docsease-efacc.cloudfunctions.net/';

    // Calls a Super Admin Cloud Function; throws with the server's message on failure
    async function callAdminFunction(name, body = {}) {
      const token = await auth.currentUser.getIdToken();
      const res = await fetch(FUNCTIONS_BASE + name, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(body)
      });
      let data = {};
      try { data = await res.json(); } catch (e) { /* non-JSON error */ }
      if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
      return data;
    }

    console.log('[review_queue] v2 loaded (batch accept/decline)');

    // Loading toast helper
    function showLoadingToast(title, msg) {
      showToast('info', title, msg, '');
      const toastIcon = document.getElementById('toast-icon');
      if (toastIcon) {
        toastIcon.className = 'toast-icon loading';
        toastIcon.innerHTML = '<div class="toast-loading-spinner"></div>';
      }
      const toastButton = document.getElementById('toast-btn');
      if (toastButton) toastButton.disabled = true;
    }


    let currentSuperAdmin = null;
    let allRequests = [];
    let pendingRequests = []; // from 'requests'
    let completedRequests = []; // from 'completed_requests'
    let mainTab = 'pending'; // 'pending' | 'completed' | 'deleted'
    let deletedRecords = []; // trashed offices + services from adminListDeletedServices
    let deletedState = 'idle'; // 'idle' | 'loading' | 'ready' | 'error'
    let kindFilter = 'all'; // 'all' | 'office' | 'service' (Deleted Records only)
    const busyRecords = new Set(); // record keys with an action in progress
    let typeFilter = 'all'; // 'all' | 'new_admin' | 'delete_admin' | 'delete_service'
    let dateFilter = 'today'; // 'today' | 'week' | 'earlier'
    let searchQuery = ''; // lowercased, trimmed

    const TYPE_LABELS = {
      new_admin: { pending: 'Pending Admin Account', completed: 'Completed Admin Account' },
      delete_admin: { pending: 'Pending Admin Deleted Account', completed: 'Completed Admin Deleted Account' },
      delete_service: { pending: 'Pending Deleted Service', completed: 'Completed Deleted Service' }
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      try {
        const adminSnap = await getDoc(doc(db, 'admin', user.uid));
        if (!adminSnap.exists()) {
          await signOut(auth);
          window.location.href = 'login.html';
          return;
        }
        const adminData = adminSnap.data();
        if (adminData.role !== 'super_admin') {
          // Super Admin-only page
          window.location.href = 'dashboard.html';
          return;
        }
        currentSuperAdmin = { uid: user.uid, name: adminData.full_name || user.email };

        const userNameEl = document.querySelector('.user-name');
        const userRoleEl = document.querySelector('.user-role');
        if (userNameEl) userNameEl.textContent = adminData.full_name || user.email;
        if (userRoleEl) userRoleEl.textContent = 'Super Admin ✓';

        document.getElementById('main-content').classList.add('is-ready');
        listenToRequests();
      } catch (error) {
        console.error('Auth check failed:', error);
        await signOut(auth);
        window.location.href = 'login.html';
      }
    });

    // Red notification badge: number of requests waiting for review
    function updateNotifBadges() {
      const count = pendingRequests.filter(r => (r.status || 'pending') === 'pending').length;
      const label = count > 99 ? '99+' : String(count);
      ['rq-tab-badge'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = label;
        el.hidden = count === 0;
        el.setAttribute('aria-label', count + ' pending request' + (count === 1 ? '' : 's'));
      });
    }

    function rebuildAndRender() {
      allRequests = [...pendingRequests, ...completedRequests];
      updateNotifBadges();
      render();
    }

    function onListenError(error) {
      console.error('Failed to load requests:', error);
      document.getElementById('rq-grid').innerHTML = '<div class="rq-empty">Couldn\'t load requests. Please refresh.</div>';
    }

    function listenToRequests() {
      // Pending tab
      onSnapshot(query(collection(db, 'requests'), orderBy('createdAt', 'desc')), (snap) => {
        pendingRequests = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
        rebuildAndRender();
      }, onListenError);

      // Completed tab
      onSnapshot(query(collection(db, 'completed_requests'), orderBy('resolvedAt', 'desc')), (snap) => {
        completedRequests = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
        rebuildAndRender();
      }, onListenError);
    }

    function toDate(ts) {
      if (!ts) return null;
      return typeof ts.toDate === 'function' ? ts.toDate() : new Date(ts);
    }

    function dateBucket(d) {
      if (!d) return 'earlier';
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const startOfWeek = new Date(startOfToday.getTime() - 6 * 24 * 60 * 60 * 1000);
      if (d >= startOfToday) return 'today';
      if (d >= startOfWeek) return 'week';
      return 'earlier';
    }

    function timeAgo(d) {
      if (!d) return '';
      const diffMs = Date.now() - d.getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'Just now';
      if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
      const days = Math.floor(hrs / 24);
      if (days < 7) return days + (days === 1 ? ' day ago' : ' days ago');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function descriptionFor(req) {
      const done = (req.status || 'pending') === 'completed';
      const svc = req.service_name ? '"' + escapeHtml(req.service_name) + '"' : 'a service';
      switch (req.type) {
        case 'new_admin':
          return done
            ? `The admin account for the ${escapeHtml(req.office_name || 'office')} was accepted.`
            : `A new admin account for the ${escapeHtml(req.office_name || 'office')} is waiting. Come and check it out.`;
        case 'delete_admin':
          return done
            ? `The request of ${escapeHtml(req.requested_by_name || 'this admin')} to delete their own admin account was accepted.`
            : `${escapeHtml(req.requested_by_name || 'This admin')} requested to delete their own admin account.`;
        case 'delete_service':
          return done
            ? `The request to delete ${svc} in the office ${escapeHtml(req.office_name || '')} was accepted.`
            : `Requested to delete ${svc} in the office ${escapeHtml(req.office_name || '')}, still waiting to accept request.`;
        default:
          return 'A new request is waiting for review.';
      }
    }

    window.setMainTab = function (tab) {
      mainTab = tab;
      const isDeleted = tab === 'deleted';
      document.getElementById('tab-pending').classList.toggle('active', tab === 'pending');
      document.getElementById('tab-completed').classList.toggle('active', tab === 'completed');
      document.getElementById('tab-deleted').classList.toggle('active', isDeleted);

      // Deleted Records shows every trashed office and service, so the request filters don't apply
      document.getElementById('rq-type-filters').hidden = isDeleted;
      document.getElementById('rq-kind-filters').hidden = !isDeleted;
      document.getElementById('rq-date-filters').hidden = isDeleted;
      document.getElementById('rq-banner-title').textContent = isDeleted ? 'Deleted Records' : 'Review Request';
      document.getElementById('rq-banner-sub').textContent = isDeleted
        ? 'Deleted offices and services are kept for 30 days. Recover them or delete them permanently.'
        : 'Manage request, accept or decline request admin.';
      document.getElementById('search-input').placeholder = isDeleted
        ? 'Search deleted records...'
        : 'Search requests...';

      document.querySelectorAll('#rq-type-filters .rq-typechip').forEach(chip => {
        const type = chip.dataset.type;
        if (type === 'all') { chip.textContent = 'All'; return; }
        chip.textContent = TYPE_LABELS[type][tab === 'completed' ? 'completed' : 'pending'];
      });

      if (isDeleted && deletedState !== 'loading') loadDeletedRecords();
      render();
    };

    window.setKindFilter = function (kind) {
      kindFilter = kind;
      document.querySelectorAll('#rq-kind-filters .rq-typechip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.kind === kind);
      });
      render();
    };

    async function loadDeletedRecords() {
      deletedState = 'loading';
      if (mainTab === 'deleted') render();
      try {
        const data = await callAdminFunction('adminListDeletedServices');
        const offices = (data.offices || []).map(o => ({
          ...o, kind: 'office', key: 'office:' + o.officeId, name: o.officeName
        }));
        const services = (data.services || []).map(s => ({
          ...s, kind: 'service', key: 'service:' + s.officeId + '/' + s.serviceId, name: s.serviceName
        }));
        deletedRecords = [...offices, ...services].sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
        deletedState = 'ready';
      } catch (error) {
        console.error('Could not load deleted records:', error);
        deletedState = 'error';
      }
      if (mainTab === 'deleted') render();
    }

    window.setTypeFilter = function (type) {
      typeFilter = type;
      document.querySelectorAll('#rq-type-filters .rq-typechip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.type === type);
      });
      render();
    };

    window.setDateFilter = function (range) {
      dateFilter = range;
      document.querySelectorAll('.rq-datechip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.range === range);
      });
      render();
    };

    function matchesSearch(r, wantStatus) {
      const typeLabel = TYPE_LABELS[r.type]?.[wantStatus] || '';
      return [
        r.requested_by_name,
        r.requested_by_email,
        r.office_name,
        r.service_name,
        r.resolvedBy_name,
        typeLabel
      ].some(v => String(v || '').toLowerCase().includes(searchQuery));
    }

    // Search only re-renders from cached snapshot data; listeners are untouched
    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value.trim().toLowerCase();
      render();
    });

    function render() {
      if (mainTab === 'deleted') { renderDeleted(); return; }
      const wantStatus = mainTab === 'completed' ? 'completed' : 'pending';
      let items = allRequests.filter(r => (r.status || 'pending') === wantStatus);

      if (typeFilter !== 'all') items = items.filter(r => r.type === typeFilter);

      items = items.filter(r => {
        const d = toDate(wantStatus === 'completed' ? r.resolvedAt : r.createdAt);
        return dateBucket(d) === dateFilter;
      });

      if (searchQuery) items = items.filter(r => matchesSearch(r, wantStatus));

      const grid = document.getElementById('rq-grid');
      grid.removeAttribute('aria-busy');
      if (!items.length) {
        grid.innerHTML = searchQuery
          ? `<div class="rq-empty">No ${wantStatus} requests match "${escapeHtml(document.getElementById('search-input').value.trim())}".</div>`
          : `<div class="rq-empty">No ${wantStatus} requests here.</div>`;
        return;
      }

    grid.innerHTML = items.map(req => {
        const d = toDate(wantStatus === 'completed' ? req.resolvedAt : req.createdAt);
        const statusBadge = wantStatus === 'completed'
          ? '<span class="rq-status-badge completed">COMPLETED</span>'
          : '<span class="rq-status-badge pending">PENDING</span>';

        const actions = wantStatus === 'pending' ? `
          <div class="rq-card-actions">
            <button type="button" class="rq-btn decline" data-action="decline" data-id="${req.id}" data-type="${req.type}">Decline</button>
            <button type="button" class="rq-btn accept" data-action="accept" data-id="${req.id}" data-type="${req.type}">Accept</button>
          </div>` : '';

        const deleteBtn = wantStatus === 'completed'
          ? `<button type="button" class="btn-delete-record" title="Delete this record" aria-label="Delete this record" data-action="delete" data-id="${req.id}">
              <img src="assets/delete.svg" alt="" />
            </button>`
          : '';

        return `
          <div class="rq-card">
            <div class="rq-card-top">
              <div class="rq-avatar">${escapeHtml((req.requested_by_name || '?').charAt(0).toUpperCase())}</div>
              <div class="rq-card-who">
                <div class="rq-name">${escapeHtml(req.requested_by_name || 'Unknown')}</div>
                <div class="rq-role">Admin</div>
              </div>
              <div class="rq-card-meta">
                <div class="rq-time">${escapeHtml(timeAgo(d))}</div>
                ${statusBadge}
              </div>
            </div>
            <div class="rq-card-desc">${descriptionFor(req)}</div>
            <div class="rq-office-badge-row">
              <div class="rq-office-badge">
                <span>${escapeHtml(req.office_name || 'No office')}</span>
                ${deleteBtn}
              </div>
            </div>
            ${actions}
          </div>`;
      }).join('');
    }

    document.getElementById('rq-grid').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const { action, id, type } = btn.dataset;
      console.log('[review_queue] click', action, id, type);
      if (action === 'accept') acceptRequest(id, type);
      if (action === 'decline') declineRequest(id, type);
      if (action === 'delete') deleteCompletedRequest(id);
      if (action === 'recover') recoverRecord(btn.dataset.key);
      if (action === 'purge') purgeRecord(btn.dataset.key);
    });

    // Permanently deletes a completed_requests record (Super Admin only)
    async function deleteCompletedRequest(reqId) {
      showConfirmToast({
        type: 'warning',
        title: 'Delete Record',
        msg: 'This will permanently remove this record from history. This cannot be undone.',
        confirmText: 'Yes, Delete',
        cancelText: 'Cancel',
        onConfirm: async () => {
          showLoadingToast('Deleting...', 'Removing the record.');
          try {
            await callAdminFunction('adminDeleteCompletedRequest', { requestId: reqId });
            showToast('success', 'Deleted', 'The record has been removed.');
          } catch (error) {
            console.error('Could not delete completed request:', error);
            showToast('error', 'Delete Failed', 'Could not delete this record (' + error.message + ').');
          }
        }
      });
    }

    // ---------- Deleted Records (trashed offices and services) ----------
    const DAY_MS = 24 * 60 * 60 * 1000;

    // Per-kind wording and backend calls; everything else is shared
    const TRASH_KINDS = {
      service: {
        label: 'Service',
        restoreFn: 'adminRestoreService',
        purgeFn: 'adminPurgeService',
        ids: r => ({ officeId: r.officeId, serviceId: r.serviceId }),
        restoredLog: 'service_restored',
        purgedLog: 'service_purged',
        logDetails: r => ({ office_name: r.officeName, service_name: r.name }),
        recoverMsg: r => `Recover "${r.name}" to ${r.officeName}? It will appear again in Service Management.`,
        recoverLoading: 'Restoring the service to its office.',
        recoveredMsg: r => `"${r.name}" is back in ${r.officeName}.`,
        purgeMsg: r => `"${r.name}" (${r.officeName}) and all of its saved data will be permanently deleted. This cannot be recovered.`,
        purgeLoading: 'Permanently deleting the service and its data.'
      },
      office: {
        label: 'Office',
        restoreFn: 'adminRestoreOffice',
        purgeFn: 'adminPurgeOffice',
        ids: r => ({ officeId: r.officeId }),
        restoredLog: 'office_restored',
        purgedLog: 'office_purged',
        logDetails: r => ({ office_name: r.name }),
        recoverMsg: r => `Recover "${r.name}"? It will appear again in Service Management with all of its services.`,
        recoverLoading: 'Restoring the office and its services.',
        recoveredMsg: (r, data) => `"${r.name}" is back in Service Management with all of its services.` +
          (data.hadMapSlot && !data.mapSlotRestored ? ' Its map room is now used by another office, so place it again in Map Management.' : ''),
        purgeMsg: r => `"${r.name}", its ${serviceCountLabel(r.serviceCount)} and all of their saved data will be permanently deleted. This cannot be recovered.`,
        purgeLoading: 'Permanently deleting the office, its services and all of their data.'
      }
    };

    function serviceCountLabel(n) {
      return n === 1 ? '1 service' : (n || 0) + ' services';
    }

    function formatDate(ms) {
      return ms ? new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '-';
    }

    function daysLeft(permanentDeleteAt) {
      if (!permanentDeleteAt) return null;
      return Math.max(0, Math.ceil((permanentDeleteAt - Date.now()) / DAY_MS));
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function findDeleted(key) {
      return deletedRecords.find(r => r.key === key);
    }

    function renderDeleted() {
      const grid = document.getElementById('rq-grid');
      if (deletedState === 'loading' || deletedState === 'idle') {
        grid.setAttribute('aria-busy', 'true');
        grid.innerHTML = '<div class="rq-empty">Loading deleted records...</div>';
        return;
      }
      grid.removeAttribute('aria-busy');
      if (deletedState === 'error') {
        grid.innerHTML = '<div class="rq-empty">Couldn\'t load deleted records. <button type="button" class="rq-retry" data-action="retry-deleted">Try again</button></div>';
        return;
      }

      let items = deletedRecords;
      if (kindFilter !== 'all') items = items.filter(r => r.kind === kindFilter);
      if (searchQuery) {
        items = items.filter(r => [r.name, r.officeName, r.requestedByName, r.deletedByName, TRASH_KINDS[r.kind].label]
          .some(v => String(v || '').toLowerCase().includes(searchQuery)));
      }

      if (!items.length) {
        const what = kindFilter === 'office' ? 'offices' : kindFilter === 'service' ? 'services' : 'offices or services';
        grid.innerHTML = searchQuery
          ? `<div class="rq-empty">No deleted records match "${escapeHtml(document.getElementById('search-input').value.trim())}".</div>`
          : `<div class="rq-empty">No deleted ${what}. Offices and services you delete will stay here for 30 days.</div>`;
        return;
      }

      grid.innerHTML = items.map(r => {
        const kind = TRASH_KINDS[r.kind];
        const isOffice = r.kind === 'office';
        const left = daysLeft(r.permanentDeleteAt);
        const busy = busyRecords.has(r.key);
        const leftLabel = left === null ? '' : left === 0 ? 'Deletes today' : left + (left === 1 ? ' day left' : ' days left');
        const who = r.requestedByName
          ? `Deletion requested by ${escapeHtml(r.requestedByName)}`
          : `Deleted by ${escapeHtml(r.deletedByName || 'Super Admin')}`;
        // A service can't be recovered into an office that is itself in Deleted Records
        const blockedByOffice = !isOffice && r.officeDeleted;
        const dataAttrs = `data-key="${escapeAttr(r.key)}"`;
        const contents = isOffice
          ? ` Includes ${escapeHtml(serviceCountLabel(r.serviceCount))}, which will be recovered or deleted with it.`
          : blockedByOffice ? ' Its office is also in Deleted Records. Recover the office first.' : '';

        return `
          <div class="rq-card">
            <div class="rq-card-top">
              <div class="rq-avatar rq-avatar--deleted${isOffice ? ' rq-avatar--office' : ''}">${escapeHtml((r.name || '?').charAt(0).toUpperCase())}</div>
              <div class="rq-card-who">
                <div class="rq-name">${escapeHtml(r.name)} <span class="rq-kind-badge rq-kind-badge--${r.kind}">${kind.label}</span></div>
                <div class="rq-role">${who}</div>
              </div>
              <div class="rq-card-meta">
                <div class="rq-time">Deleted ${escapeHtml(timeAgo(r.deletedAt ? new Date(r.deletedAt) : null))}</div>
                <span class="rq-status-badge deleted${left !== null && left <= 3 ? ' expiring' : ''}">${escapeHtml(leftLabel || 'DELETED')}</span>
              </div>
            </div>
            <div class="rq-card-desc">
              Deleted on ${escapeHtml(formatDate(r.deletedAt))}. It will be permanently deleted on
              <strong>${escapeHtml(formatDate(r.permanentDeleteAt))}</strong> unless recovered.${contents}
            </div>
            <div class="rq-office-badge-row">
              <div class="rq-office-badge"><span>${escapeHtml(r.officeName)}</span></div>
            </div>
            <div class="rq-card-actions">
              <button type="button" class="rq-btn purge" data-action="purge" ${dataAttrs} ${busy ? 'disabled' : ''}>
                <img src="assets/delete.svg" alt="" /> Delete Permanently
              </button>
              <button type="button" class="rq-btn recover" data-action="recover" ${dataAttrs} ${busy || blockedByOffice ? 'disabled' : ''}
                ${blockedByOffice ? 'title="Recover the office first"' : ''}>Recover ${kind.label}</button>
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('rq-grid').addEventListener('click', (e) => {
      if (e.target.closest('[data-action="retry-deleted"]')) loadDeletedRecords();
    });

    async function runRecordAction(r, work) {
      if (busyRecords.has(r.key)) return;
      busyRecords.add(r.key);
      render();
      try {
        await work();
      } finally {
        busyRecords.delete(r.key);
        render();
      }
    }

    function recoverRecord(key) {
      const r = findDeleted(key);
      if (!r || busyRecords.has(key)) return;
      const kind = TRASH_KINDS[r.kind];
      showConfirmToast({
        type: 'info',
        title: `Recover ${kind.label}`,
        msg: kind.recoverMsg(r),
        confirmText: 'Yes, Recover',
        cancelText: 'Cancel',
        onConfirm: () => runRecordAction(r, async () => {
          showLoadingToast('Recovering...', kind.recoverLoading);
          try {
            const data = await callAdminFunction(kind.restoreFn, kind.ids(r));
            deletedRecords = deletedRecords.filter(x => x !== r);
            // Services inside a recovered office can be recovered again
            if (r.kind === 'office') {
              deletedRecords.forEach(x => { if (x.kind === 'service' && x.officeId === r.officeId) x.officeDeleted = false; });
            }
            await logActivity(kind.restoredLog, kind.logDetails(r));
            showToast('success', `${kind.label} Recovered`, kind.recoveredMsg(r, data), 'OK');
          } catch (error) {
            console.error('Recover failed:', error);
            showToast('error', 'Recover Failed', error.message, 'OK');
            loadDeletedRecords();
          }
        })
      });
    }

    function purgeRecord(key) {
      const r = findDeleted(key);
      if (!r || busyRecords.has(key)) return;
      const kind = TRASH_KINDS[r.kind];

      // Step 1: warning
      showConfirmToast({
        type: 'warning',
        title: 'Delete Permanently?',
        msg: kind.purgeMsg(r),
        confirmText: 'Continue',
        cancelText: 'Cancel',
        onConfirm: () => setTimeout(() => askPurgeVerification(r), 0)
      });
    }

    // Step 2: type the office/service name to verify (checked again on the server)
    function askPurgeVerification(r) {
      const kind = TRASH_KINDS[r.kind];
      const noun = kind.label.toLowerCase();
      showConfirmToast({
        type: 'error',
        title: 'Confirm Permanent Deletion',
        msg: `Type the ${noun} name to confirm:`,
        confirmText: 'Delete Permanently',
        cancelText: 'Cancel',
        onConfirm: () => {
          const typed = (document.getElementById('rq-verify-input')?.value || '').trim();
          runRecordAction(r, async () => {
            showLoadingToast('Deleting...', kind.purgeLoading);
            try {
              await callAdminFunction(kind.purgeFn, { ...kind.ids(r), confirmName: typed });
              // Deleting an office also removed its trashed services
              deletedRecords = deletedRecords.filter(x => x !== r &&
                !(r.kind === 'office' && x.kind === 'service' && x.officeId === r.officeId));
              await logActivity(kind.purgedLog, kind.logDetails(r));
              showToast('success', 'Permanently Deleted', `"${r.name}" has been permanently deleted.`, 'OK');
            } catch (error) {
              console.error('Permanent delete failed:', error);
              showToast('error', 'Delete Failed', error.message, 'OK');
              loadDeletedRecords();
            }
          });
        }
      });

      const msgEl = document.getElementById('toast-msg');
      const confirmBtn = document.getElementById('toast-btn');
      const expected = String(r.name).trim();
      msgEl.innerHTML = `Type <strong>${escapeHtml(expected)}</strong> to confirm.
        <input type="text" id="rq-verify-input" class="rq-verify-input" autocomplete="off" spellcheck="false" aria-label="Type the ${noun} name to confirm" />`;
      const input = document.getElementById('rq-verify-input');
      confirmBtn.disabled = true;
      input.addEventListener('input', () => { confirmBtn.disabled = input.value.trim() !== expected; });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !confirmBtn.disabled) confirmBtn.click(); });
      setTimeout(() => input.focus(), 50);
    }

    function declineReasonFor(type) {
      switch (type) {
        case 'new_admin': return 'Your admin account request was not approved.';
        case 'delete_admin': return 'Your account deletion request was not approved.';
        case 'delete_service': return 'Your service deletion request was not approved.';
        default: return 'Your request was not approved.';
      }
    }

    // Deletes the Auth login via Cloud Function; returns true/false, never throws
    async function deleteAuthUser(uid) {
      try {
        const token = await auth.currentUser.getIdToken();
        const res = await fetch(DELETE_AUTH_USER_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ uid })
        });
        return res.ok;
      } catch (err) {
        console.error('deleteAuthUser failed:', err);
        return false;
      }
    }

    async function acceptRequest(reqId, type) {
      const reqRef = doc(db, 'requests', reqId);
      let reqData;
      try {
        const reqSnap = await getDoc(reqRef);
        if (!reqSnap.exists()) {
          showToast('error', 'Request Not Found', 'This request no longer exists. Please refresh the page.');
          return;
        }
        reqData = reqSnap.data();
      } catch (error) {
        console.error('Could not read request:', error);
        showToast('error', 'Action Failed', 'Could not load this request (' + (error.code || error.message) + ').');
        return;
      }

      showConfirmToast({
        type: 'info',
        title: 'Accept Request',
        msg: 'Are you sure you want to accept this request?',
        confirmText: 'Yes, Accept',
        cancelText: 'Cancel',
        onConfirm: async () => {
          showLoadingToast('Processing...', 'Applying the request.');
          try {
            // Get the admin's email now (before the account can be deleted)
            let adminEmail = reqData.requested_by_email || '';
            if (type === 'delete_admin' && !adminEmail && reqData.target_admin_uid) {
              try {
                const adminSnap = await getDoc(doc(db, 'admin', reqData.target_admin_uid));
                adminEmail = adminSnap.exists() ? (adminSnap.data().email || '') : '';
              } catch (e) {
                console.error('Could not look up admin email:', e);
              }
            }

            // Atomic batch: apply, copy to completed_requests, remove from requests
            const batch = writeBatch(db);

            if (type === 'new_admin' && reqData.target_admin_uid) {
              // pending -> active
              batch.update(doc(db, 'admin', reqData.target_admin_uid), {
                status: 'active',
                approvedAt: serverTimestamp(),
                approvedBy_uid: currentSuperAdmin.uid,
                updatedAt: serverTimestamp()
              });
            } else if (type === 'delete_admin' && reqData.target_admin_uid) {
              batch.delete(doc(db, 'admin', reqData.target_admin_uid));
            }

            if (type === 'delete_service' && reqData.office_id && reqData.service_id) {
              // Moves the service to Deleted Records and completes the request in one server-side transaction
              await callAdminFunction('adminTrashService', {
                requestId: reqId,
                officeId: reqData.office_id,
                serviceId: reqData.service_id
              });
              deletedState = 'idle'; // reload Deleted Records next time it opens
            } else {
              batch.set(doc(db, 'completed_requests', reqId), {
                ...reqData,
                status: 'completed',
                resolvedAt: serverTimestamp(),
                resolvedBy_uid: currentSuperAdmin.uid,
                resolvedBy_name: currentSuperAdmin.name
              });
              batch.delete(reqRef);

              await batch.commit();
            }

            const acceptedLog = { new_admin: 'admin_account_accepted', delete_service: 'service_delete_accepted' }[type];
            if (acceptedLog) {
              await logActivity(acceptedLog, {
                office_name: reqData.office_name || '',
                service_name: reqData.service_name || '',
                target_name: reqData.requested_by_name || '',
                // Notify the admin
                recipient_uid: reqData.requested_by_uid || reqData.target_admin_uid || ''
              });
            }

            // Email the admin that the account is ready for sign in
            if (type === 'new_admin') {
              await sendRegistrationEmail(
                reqData.requested_by_email,
                reqData.requested_by_name,
                reqData.office_name,
                'accepted'
              );
            }

            // Email the admin that the service deletion was approved
            if (type === 'delete_service') {
              await sendRequestCompleted(
                reqData.requested_by_email,
                reqData.requested_by_name,
                'service deletion',
                true,
                'Service: ' + (reqData.service_name || '-') + '<br>Office: ' + (reqData.office_name || '-')
              );
            }

            // Email the admin that the account deletion was approved
            if (type === 'delete_admin') {
              await sendRequestCompleted(
                adminEmail,
                reqData.requested_by_name,
                'account deletion',
                true,
                'Email: ' + (adminEmail || '-')
              );
            }

            // Also removes the Auth login
            let authRemoved = true;
            if (type === 'delete_admin' && reqData.target_admin_uid) {
              authRemoved = await deleteAuthUser(reqData.target_admin_uid);
            }

            document.getElementById('toast-overlay')?.classList.remove('show');
            showToast(
              'success',
              'Request Accepted',
              type === 'new_admin'
                ? 'The admin account is now active and can sign in.'
                : type === 'delete_service'
                  ? 'The service was moved to Deleted Records. It can be recovered within 30 days.'
                  : 'The request has been processed successfully.' + (authRemoved ? '' : ' The login account could not be removed automatically.'),
              'OK'
            );
          } catch (error) {
            console.error('Accept failed:', error);
            document.getElementById('toast-overlay')?.classList.remove('show');
            showToast('error', 'Action Failed', 'Could not process this request (' + (error.code || error.message) + ').');
          }
        }
      });
    }

    async function declineRequest(reqId, type) {
      const reqRef = doc(db, 'requests', reqId);
      let reqData;
      try {
        const reqSnap = await getDoc(reqRef);
        if (!reqSnap.exists()) {
          showToast('error', 'Request Not Found', 'This request no longer exists. Please refresh the page.');
          return;
        }
        reqData = reqSnap.data();
      } catch (error) {
        console.error('Could not read request:', error);
        showToast('error', 'Action Failed', 'Could not load this request (' + (error.code || error.message) + ').');
        return;
      }

      showConfirmToast({
        type: 'warning',
        title: 'Decline Request',
        msg: 'This request will be permanently removed. Continue?',
        confirmText: 'Yes, Decline',
        cancelText: 'Cancel',
        onConfirm: async () => {
          showLoadingToast('Declining...', 'Removing the request.');
          try {
            // Get the admin's email now (before the account can be deleted)
            let adminEmail = reqData.requested_by_email || '';
            if (type === 'delete_admin' && !adminEmail && reqData.target_admin_uid) {
              try {
                const adminSnap = await getDoc(doc(db, 'admin', reqData.target_admin_uid));
                adminEmail = adminSnap.exists() ? (adminSnap.data().email || '') : '';
              } catch (e) {
                console.error('Could not look up admin email:', e);
              }
            }

            // 1. Remove Auth login
            let authRemoved = true;
            if (type === 'new_admin' && reqData.target_admin_uid) {
              authRemoved = await deleteAuthUser(reqData.target_admin_uid);
            }

            // 2. Delete admin doc + request doc
            const batch = writeBatch(db);
            if (type === 'new_admin' && reqData.target_admin_uid) {
              batch.delete(doc(db, 'admin', reqData.target_admin_uid));
            }
            batch.delete(reqRef);
            await batch.commit();

            const declinedLog = { new_admin: 'admin_account_declined', delete_service: 'service_delete_declined' }[type];
            if (declinedLog) {
              await logActivity(declinedLog, {
                office_name: reqData.office_name || '',
                service_name: reqData.service_name || '',
                target_name: reqData.requested_by_name || '',
                // No one to notify
                recipient_uid: type === 'delete_service' ? (reqData.requested_by_uid || '') : ''
              });
            }

            // Email the admin that the request was not approved
            if (type === 'new_admin') {
              await sendRegistrationEmail(
                reqData.requested_by_email,
                reqData.requested_by_name,
                reqData.office_name,
                'rejected'
              );
            } else if (type === 'delete_service') {
              await sendRequestCompleted(
                reqData.requested_by_email,
                reqData.requested_by_name,
                'service deletion',
                false,
                'Service: ' + (reqData.service_name || '-') + '<br>Office: ' + (reqData.office_name || '-')
              );
            } else if (type === 'delete_admin') {
              await sendRequestCompleted(
                adminEmail,
                reqData.requested_by_name,
                'account deletion',
                false,
                'Email: ' + (adminEmail || '-')
              );
            }

            document.getElementById('toast-overlay')?.classList.remove('show');
            showToast(
              'success',
              'Request Declined',
              authRemoved
                ? 'The request has been removed.'
                : 'The request was removed, but the login account could not be removed automatically.',
              'OK'
            );
          } catch (error) {
            console.error('Decline failed:', error);
            document.getElementById('toast-overlay')?.classList.remove('show');
            showToast('error', 'Action Failed', 'Could not decline this request (' + (error.code || error.message) + ').');
          }
        }
      });
    }
  </script>

  <script>
    fetch('partials/profile.html')
      .then(res => res.text())
      .then(html => {
        const template = document.createElement('template');
        template.innerHTML = html;
        const script = template.content.querySelector('script');
        const profilePlaceholder = document.getElementById('profile-placeholder');
        profilePlaceholder.replaceChildren(template.content);
        if (script) {
          const executableScript = document.createElement('script');
          executableScript.textContent = script.textContent;
          document.body.appendChild(executableScript);
        }
        if (window.currentUser) updateProfileDisplay(window.currentUser);
      });
  </script>
</body>
