<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaBayan – Account Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../assets/logo_whitebg.png" />
  <link rel="stylesheet" href="../css/account_management.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/profile.css" />
  <link rel="stylesheet" href="../css/toast.css" />
  <link rel="stylesheet" href="../css/page_transition.css" />
  <script src="../functions/toast.js"></script>
  <script type="module" src="../functions/role-guard.js"></script>
  <script src="../functions/sidebar.js"></script>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="../assets/logo.png" alt="GaBayan Logo" />
      </div>
      <div class="logo-text">
        <img src="../assets/docsease_text.png" alt="GaBayan" class="brand-img" />
      </div>
    </div>

    <div class="sidebar-nav-container">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" title="Dashboard">
          <div class="nav-icon"><img src="../assets/dashboard.svg" alt="Dashboard" /></div>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="service_management.html" class="nav-item" title="Service Management">
          <div class="nav-icon"><img src="../assets/service_mngment.svg" alt="Service Management" /></div>
          <span class="nav-label">Service Management</span>
        </a>
        <a href="map_management.html" class="nav-item" title="Map Management">
          <div class="nav-icon"><img src="../assets/map_mngment.svg" alt="Map Management" /></div>
          <span class="nav-label">Map Management</span>
        </a>
        <a href="analytics.html" class="nav-item" title="Analytics">
          <div class="nav-icon"><img src="../assets/analytics.svg" alt="Analytics" /></div>
          <span class="nav-label">Analytics</span>
        </a>
        <a href="review_queue.html" class="nav-item" title="Review Queue">
          <div class="nav-icon"><img src="../assets/review_queue.svg" alt="Review Queue" /></div>
          <span class="nav-label">Review Queue</span>
        </a>
        <a href="account_management.html" class="nav-item active" title="Account Management">
          <div class="nav-icon"><img src="../assets/account_management.svg" alt="Account Management" /></div>
          <span class="nav-label">Account Management</span>
        </a>
        <a href="activity_log.html" class="nav-item" title="Activity Log">
          <div class="nav-icon"><img src="../assets/activity_log.svg" alt="Activity Log" /></div>
          <span class="nav-label">Activity Log</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <button class="btn-collapse" onclick="toggleSidebar()" title="Collapse sidebar">
        <img id="collapse-icon" src="../assets/collapse.svg" alt="Collapse" />
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="search-input-wrapper">
        <div class="search-icon-embed">
          <img src="../assets/search.svg" alt="Search icon" />
        </div>
        <input type="text" id="search-input" placeholder="Search name or email..." aria-label="Search accounts" autocomplete="off" />
      </div>
      <div id="profile-placeholder"></div>
    </header>

    <div class="content page-fade" id="main-content">
      <div class="header-group">
        <div class="title-area">
          <h2>Account Management</h2>
          <p>Monitor, deactivate and reactivate GaBayan mobile users and web admins.</p>
        </div>

        <div class="section-switch" role="tablist" aria-label="Account type">
          <button type="button" class="section-btn active" data-section="users" role="tab" aria-selected="true">
            User Management <span class="section-count" id="count-users">–</span>
          </button>
          <button type="button" class="section-btn" data-section="admins" role="tab" aria-selected="false">
            Admin Management <span class="section-count" id="count-admins">–</span>
          </button>
        </div>
      </div>

      <div class="acct-card">
        <div class="acct-toolbar">
          <div class="acct-tabs" id="status-tabs">
            <button type="button" class="acct-tab active" data-status="all">All <span data-count="all"></span></button>
            <button type="button" class="acct-tab" data-status="active">Active <span data-count="active"></span></button>
            <button type="button" class="acct-tab" data-status="inactive">Inactive <span data-count="inactive"></span></button>
            <button type="button" class="acct-tab" data-status="deactivated">Deactivated <span data-count="deactivated"></span></button>
            <button type="button" class="acct-tab admins-only" data-status="pending">Pending <span data-count="pending"></span></button>
          </div>
          <p class="acct-hint" id="inactive-hint"></p>
        </div>

        <div class="acct-table-head" id="acct-head"></div>
        <div class="acct-list" id="acct-list" aria-busy="true">
          <div class="acct-row" style="pointer-events:none;"><div class="acct-person"><span class="skel skel-circle" style="width:36px;height:36px;"></span><div class="skel-stack" style="flex:1;gap:6px;"><span class="skel skel-text" style="width:60%;"></span><span class="skel skel-text" style="width:80%;height:10px;"></span></div></div><span class="skel skel-text" style="width:70%;"></span><span class="skel skel-text" style="width:55%;"></span><span class="skel skel-pill" style="width:72px;height:22px;"></span><span class="skel skel-pill" style="width:120px;justify-self:end;"></span></div>
          <div class="acct-row" style="pointer-events:none;"><div class="acct-person"><span class="skel skel-circle" style="width:36px;height:36px;"></span><div class="skel-stack" style="flex:1;gap:6px;"><span class="skel skel-text" style="width:60%;"></span><span class="skel skel-text" style="width:80%;height:10px;"></span></div></div><span class="skel skel-text" style="width:70%;"></span><span class="skel skel-text" style="width:55%;"></span><span class="skel skel-pill" style="width:72px;height:22px;"></span><span class="skel skel-pill" style="width:120px;justify-self:end;"></span></div>
          <div class="acct-row" style="pointer-events:none;"><div class="acct-person"><span class="skel skel-circle" style="width:36px;height:36px;"></span><div class="skel-stack" style="flex:1;gap:6px;"><span class="skel skel-text" style="width:60%;"></span><span class="skel skel-text" style="width:80%;height:10px;"></span></div></div><span class="skel skel-text" style="width:70%;"></span><span class="skel skel-text" style="width:55%;"></span><span class="skel skel-pill" style="width:72px;height:22px;"></span><span class="skel skel-pill" style="width:120px;justify-self:end;"></span></div>
          <div class="acct-row" style="pointer-events:none;"><div class="acct-person"><span class="skel skel-circle" style="width:36px;height:36px;"></span><div class="skel-stack" style="flex:1;gap:6px;"><span class="skel skel-text" style="width:60%;"></span><span class="skel skel-text" style="width:80%;height:10px;"></span></div></div><span class="skel skel-text" style="width:70%;"></span><span class="skel skel-text" style="width:55%;"></span><span class="skel skel-pill" style="width:72px;height:22px;"></span><span class="skel skel-pill" style="width:120px;justify-self:end;"></span></div>
          <div class="acct-row" style="pointer-events:none;"><div class="acct-person"><span class="skel skel-circle" style="width:36px;height:36px;"></span><div class="skel-stack" style="flex:1;gap:6px;"><span class="skel skel-text" style="width:60%;"></span><span class="skel skel-text" style="width:80%;height:10px;"></span></div></div><span class="skel skel-text" style="width:70%;"></span><span class="skel skel-text" style="width:55%;"></span><span class="skel skel-pill" style="width:72px;height:22px;"></span><span class="skel skel-pill" style="width:120px;justify-self:end;"></span></div>
          <div class="acct-row" style="pointer-events:none;"><div class="acct-person"><span class="skel skel-circle" style="width:36px;height:36px;"></span><div class="skel-stack" style="flex:1;gap:6px;"><span class="skel skel-text" style="width:60%;"></span><span class="skel skel-text" style="width:80%;height:10px;"></span></div></div><span class="skel skel-text" style="width:70%;"></span><span class="skel skel-text" style="width:55%;"></span><span class="skel skel-pill" style="width:72px;height:22px;"></span><span class="skel skel-pill" style="width:120px;justify-self:end;"></span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Deactivate / reactivate confirmation -->
  <div class="am-overlay" id="status-overlay" aria-hidden="true">
    <div class="am-modal" role="dialog" aria-modal="true" aria-labelledby="status-title">
      <div class="am-header">
        <h2 class="am-title" id="status-title">Deactivate account?</h2>
        <button type="button" class="am-close" aria-label="Close" data-close>&times;</button>
      </div>
      <div class="am-body">
        <div class="am-target" id="status-target"></div>
        <ul class="am-explain" id="status-explain"></ul>
        <div class="am-field" id="reason-field">
          <label class="am-label" for="status-reason">Reason <span class="am-hint">(optional, kept with the record)</span></label>
          <textarea id="status-reason" class="am-input" rows="3" maxlength="500" placeholder="e.g. No activity for over 90 days"></textarea>
        </div>
        <div class="am-error" id="status-error"></div>
      </div>
      <div class="am-actions">
        <button type="button" class="am-btn am-btn-cancel" data-close>Cancel</button>
        <button type="button" class="am-btn am-btn-danger" id="status-submit">Deactivate</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '../Firebase/firebase-config.js';
    import { getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { logActivity } from '../functions/activity-log.js';

    const FUNCTIONS_BASE = 'https://us-central1-docsease-efacc.cloudfunctions.net';
    const INACTIVE_DAYS = 90;
    const DAY_MS = 24 * 60 * 60 * 1000;

    const state = {
      section: 'users',          // 'users' | 'admins'
      status: 'all',             // status tab
      search: '',
      selfUid: null,
      data: { users: null, admins: null }
    };

    // ---------- Access: Super Admin only ----------
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '../Authentication/auth.html';
        return;
      }
      try {
        const snap = await getDoc(doc(db, 'admin', user.uid));
        const data = snap.exists() ? snap.data() : null;
        if (!data || data.status !== 'active') {
          await signOut(auth);
          window.location.href = '../Authentication/auth.html';
          return;
        }
        if (data.role !== 'super_admin') {
          window.location.replace('dashboard.html');
          return;
        }
        state.selfUid = user.uid;
        document.getElementById('inactive-hint').textContent =
          `Inactive = no login or app activity in the last ${INACTIVE_DAYS} days.`;
        document.getElementById('main-content').classList.add('is-ready');
        loadSection('users');
        loadSection('admins', { silent: true });
      } catch (err) {
        console.error('Access check failed:', err);
        await signOut(auth);
        window.location.href = '../Authentication/auth.html';
      }
    });

    // ---------- Server calls ----------
    async function callFunction(name, body) {
      const token = await auth.currentUser.getIdToken();
      const res = await fetch(`${FUNCTIONS_BASE}/${name}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify(body)
      });
      let json = {};
      try { json = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error(json.error || `Request failed (${res.status})`);
      return json;
    }

    // Placeholder rows shown while a list is loading
    function skeletonRows(count = 6) {
      const isAdmins = state.section === 'admins';
      const widths = ['60%', '75%', '50%', '70%', '55%', '65%'];
      return Array.from({ length: count }, (_, i) => `
        <div class="acct-row${isAdmins ? ' is-admins' : ''}" aria-hidden="true" style="pointer-events:none;">
          <div class="acct-person">
            <span class="skel skel-circle" style="width:36px;height:36px;"></span>
            <div class="skel-stack" style="flex:1;gap:6px;">
              <span class="skel skel-text" style="width:${widths[i % widths.length]};"></span>
              <span class="skel skel-text" style="width:80%;height:10px;"></span>
            </div>
          </div>
          ${isAdmins ? '<span class="skel skel-text" style="width:75%;"></span>' : ''}
          <span class="skel skel-text" style="width:70%;"></span>
          <span class="skel skel-text" style="width:55%;"></span>
          <span class="skel skel-pill" style="width:72px;height:22px;"></span>
          <span class="skel skel-pill" style="width:120px;justify-self:end;"></span>
        </div>`).join('');
    }

    async function loadSection(section, { silent = false } = {}) {
      if (!silent && section === state.section) {
        document.getElementById('acct-list').innerHTML = skeletonRows();
      }
      try {
        const result = await callFunction('adminListAccounts', { type: section });
        state.data[section] = result.accounts.map(withStatus);
        updateSectionCount(section);
        if (section === state.section) render();
      } catch (err) {
        console.error('Could not load accounts:', err);
        if (section === state.section) {
          document.getElementById('acct-list').innerHTML =
            `<div class="acct-empty">Could not load accounts. ${escapeHtml(err.message)}</div>`;
        }
      }
    }

    // ---------- Status logic ----------
    // Deactivated > Pending (admins) > Inactive (no activity for INACTIVE_DAYS) > Active
    function withStatus(acct) {
      let computed;
      if (acct.status === 'deactivated' || acct.disabled) computed = 'deactivated';
      else if (acct.status === 'pending') computed = 'pending';
      else {
        const lastSeen = acct.lastActive || acct.createdAt;
        computed = lastSeen && (Date.now() - lastSeen) > INACTIVE_DAYS * DAY_MS ? 'inactive' : 'active';
      }
      return { ...acct, computed };
    }

    const STATUS_LABEL = { active: 'Active', inactive: 'Inactive', deactivated: 'Deactivated', pending: 'Pending' };

    // ---------- Rendering ----------
    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[ch]));
    }

    function formatDate(ms) {
      if (!ms) return '—';
      return new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function relative(ms) {
      if (!ms) return 'Never';
      const days = Math.floor((Date.now() - ms) / DAY_MS);
      if (days <= 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 30) return `${days} days ago`;
      return formatDate(ms);
    }

    function updateSectionCount(section) {
      const list = state.data[section];
      document.getElementById('count-' + section).textContent = list ? list.length : '–';
    }

    function filtered() {
      const list = state.data[state.section] || [];
      const q = state.search;
      return list
        .filter(a => state.status === 'all' || a.computed === state.status)
        .filter(a => !q || [a.name, a.email, a.office].some(v => String(v || '').toLowerCase().includes(q)))
        .sort((a, b) => String(a.name || a.email).localeCompare(String(b.name || b.email)));
    }

    function renderTabCounts() {
      const list = state.data[state.section] || [];
      const counts = { all: list.length, active: 0, inactive: 0, deactivated: 0, pending: 0 };
      list.forEach(a => { counts[a.computed] = (counts[a.computed] || 0) + 1; });
      document.querySelectorAll('[data-count]').forEach(el => {
        el.textContent = state.data[state.section] ? counts[el.dataset.count] : '';
      });
    }

    function renderHead() {
      const isAdmins = state.section === 'admins';
      document.getElementById('acct-head').className = 'acct-table-head' + (isAdmins ? ' is-admins' : '');
      document.getElementById('acct-head').innerHTML = `
        <span>Name</span>
        ${isAdmins ? '<span>Office</span>' : ''}
        <span>Registered</span>
        <span>Last Login</span>
        <span>Status</span>
        <span class="col-actions">Actions</span>`;
    }

    function actionsFor(a) {
      if (a.uid === state.selfUid) return '<span class="acct-note">You</span>';
      if (a.role === 'super_admin') return '<span class="acct-note">Super Admin</span>';
      if (a.computed === 'pending') return '<a class="acct-note acct-link" href="review_queue.html">Review Queue</a>';
      const toggle = a.computed === 'deactivated'
        ? `<button type="button" class="btn-row btn-reactivate" data-action="reactivate" data-uid="${escapeHtml(a.uid)}">Reactivate</button>`
        : `<button type="button" class="btn-row btn-deactivate" data-action="deactivate" data-uid="${escapeHtml(a.uid)}">Deactivate</button>`;
      return toggle;
    }

    function render() {
      document.querySelectorAll('.section-btn').forEach(btn => {
        const on = btn.dataset.section === state.section;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      document.querySelectorAll('.acct-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === state.status);
      });
      document.getElementById('status-tabs').classList.toggle('show-admins', state.section === 'admins');
      renderHead();
      renderTabCounts();

      const listEl = document.getElementById('acct-list');
      if (!state.data[state.section]) {
        listEl.innerHTML = skeletonRows();
        listEl.setAttribute('aria-busy', 'true');
        return;
      }
      listEl.removeAttribute('aria-busy');

      const rows = filtered();
      if (!rows.length) {
        listEl.innerHTML = `<div class="acct-empty">${state.search ? 'No accounts match your search.' : 'No accounts in this list.'}</div>`;
        return;
      }

      const isAdmins = state.section === 'admins';
      listEl.innerHTML = rows.map(a => {
        const initials = (a.name || a.email || '?').trim().split(/\s+/).slice(0, 2).map(s => s[0]).join('').toUpperCase();
        const deactInfo = a.computed === 'deactivated' && a.deactivatedAt
          ? `<span class="acct-sub">Deactivated ${formatDate(a.deactivatedAt)}${a.deactivatedBy ? ' by ' + escapeHtml(a.deactivatedBy) : ''}${a.deactivationReason ? ' · ' + escapeHtml(a.deactivationReason) : ''}</span>`
          : '';
        return `
          <div class="acct-row${isAdmins ? ' is-admins' : ''}">
            <div class="acct-person">
              <div class="acct-avatar" aria-hidden="true">${escapeHtml(initials)}</div>
              <div class="acct-person-text">
                <span class="acct-name">${escapeHtml(a.name || 'Unnamed account')}</span>
                <span class="acct-sub">${escapeHtml(a.email || 'No email')}</span>
                ${deactInfo}
              </div>
            </div>
            ${isAdmins ? `<div class="acct-cell" data-label="Office">${escapeHtml(a.office || '—')}</div>` : ''}
            <div class="acct-cell" data-label="Registered">${formatDate(a.createdAt)}</div>
            <div class="acct-cell" data-label="Last login" title="${a.lastActive ? new Date(a.lastActive).toLocaleString() : ''}">${relative(a.lastActive)}</div>
            <div class="acct-cell" data-label="Status"><span class="status-badge status-${a.computed}">${STATUS_LABEL[a.computed]}</span></div>
            <div class="acct-actions">${actionsFor(a)}</div>
          </div>`;
      }).join('');
    }

    // ---------- Toolbar events ----------
    document.querySelectorAll('.section-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.section === btn.dataset.section) return;
        state.section = btn.dataset.section;
        if (state.section === 'users' && state.status === 'pending') state.status = 'all';
        render();
      });
    });

    document.getElementById('status-tabs').addEventListener('click', e => {
      const btn = e.target.closest('.acct-tab');
      if (!btn) return;
      state.status = btn.dataset.status;
      render();
    });

    document.getElementById('search-input').addEventListener('input', e => {
      state.search = e.target.value.trim().toLowerCase();
      render();
    });

    function findAccount(uid) {
      return (state.data[state.section] || []).find(a => a.uid === uid);
    }

    document.getElementById('acct-list').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const acct = findAccount(btn.dataset.uid);
      if (!acct) return;
      openStatus(acct, btn.dataset.action);
    });

    // ---------- Modals ----------
    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.add('show');
      el.setAttribute('aria-hidden', 'false');
    }
    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('show');
      el.setAttribute('aria-hidden', 'true');
    }
    document.querySelectorAll('.am-overlay').forEach(overlay => {
      overlay.addEventListener('click', e => {
        if (e.target === overlay || e.target.closest('[data-close]')) closeModal(overlay.id);
      });
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      document.querySelectorAll('.am-overlay.show').forEach(o => closeModal(o.id));
    });

    // Deactivate / reactivate
    let statusTarget = null;
    let statusAction = null;

    function openStatus(acct, action) {
      statusTarget = acct;
      statusAction = action;
      const isUser = state.section === 'users';
      const who = isUser ? 'mobile user' : 'admin';
      const deactivate = action === 'deactivate';

      document.getElementById('status-title').textContent = deactivate ? 'Deactivate account?' : 'Reactivate account?';
      document.getElementById('status-target').innerHTML = `
        <span class="acct-name">${escapeHtml(acct.name || 'Unnamed account')}</span>
        <span class="acct-sub">${escapeHtml(acct.email)}${acct.office ? ' · ' + escapeHtml(acct.office) : ''}</span>
        <span class="status-badge status-${acct.computed}">${STATUS_LABEL[acct.computed]}</span>`;

      const points = deactivate ? [
        `This ${who} will be signed out and <strong>can no longer sign in</strong> to ${isUser ? 'the GaBayan mobile app' : 'the GaBayan web admin'}.`,
        'Their account record and history are <strong>kept</strong>, not deleted.',
        'You can reactivate the account at any time from the Deactivated tab.'
      ] : [
        `This ${who} will be able to <strong>sign in again</strong> with their existing credentials.`,
        isUser ? 'Their previous data and history are restored as they were.' : `They will regain access to ${escapeHtml(acct.office || 'their office')} only.`
      ];
      document.getElementById('status-explain').innerHTML = points.map(p => `<li>${p}</li>`).join('');

      document.getElementById('reason-field').style.display = deactivate ? '' : 'none';
      document.getElementById('status-reason').value =
        deactivate && acct.computed === 'inactive' ? `No activity for over ${INACTIVE_DAYS} days` : '';
      document.getElementById('status-error').textContent = '';

      const submit = document.getElementById('status-submit');
      submit.textContent = deactivate ? 'Deactivate' : 'Reactivate';
      submit.className = 'am-btn ' + (deactivate ? 'am-btn-danger' : 'am-btn-primary');
      submit.disabled = false;
      openModal('status-overlay');
    }

    document.getElementById('status-submit').addEventListener('click', async () => {
      if (!statusTarget) return;
      const submit = document.getElementById('status-submit');
      const label = submit.textContent;
      const section = state.section;
      const target = statusTarget;
      const action = statusAction;
      submit.disabled = true;
      submit.textContent = action === 'deactivate' ? 'Deactivating…' : 'Reactivating…';
      try {
        await callFunction('adminSetAccountStatus', {
          type: section, uid: target.uid, action,
          reason: document.getElementById('status-reason').value
        });
        closeModal('status-overlay');
        showToast('success',
          action === 'deactivate' ? 'Account Deactivated' : 'Account Reactivated',
          `${target.name || target.email} has been ${action === 'deactivate' ? 'deactivated' : 'reactivated'}.`);
        logActivity(`${section === 'admins' ? 'admin' : 'user'}_account_${action}d`, {
          target_name: target.name || target.email,
          target_uid: target.uid,
          office_name: section === 'admins' ? target.office : ''
        });
        await loadSection(section);
      } catch (err) {
        document.getElementById('status-error').textContent = err.message;
      } finally {
        submit.disabled = false;
        submit.textContent = label;
      }
    });
  </script>

  <script>
    fetch('../Authentication/profile.html')
      .then(res => res.text())
      .then(html => {
        const template = document.createElement('template');
        template.innerHTML = html;
        const script = template.content.querySelector('script');
        const profilePlaceholder = document.getElementById('profile-placeholder');
        profilePlaceholder.replaceChildren(template.content);
        if (script) {
          const executableScript = document.createElement('script');
          executableScript.textContent = script.textContent;
          document.body.appendChild(executableScript);
        }
        if (window.currentUser) updateProfileDisplay(window.currentUser);
      });
  </script>

</body>
</html>
