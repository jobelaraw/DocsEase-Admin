<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocsEase – Service Management</title>
  <link rel="icon" type="image/png" href="../assets/logo_whitebg.png" />
  <link rel="stylesheet" href="../css/service_management.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/profile.css" />
  <script src="../functions/profile.js"></script>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="../assets/logo.png" alt="DocsEase Logo" />
      </div>
      <div class="logo-text">
        <img src="../assets/docsease_text.png" alt="DocsEase" class="brand-img" />
      </div>
    </div>

    <div class="sidebar-nav-container">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <div class="nav-icon"><img src="../assets/dashboard.png" alt="Dashboard" /></div>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="service_management.html" class="nav-item active">
          <div class="nav-icon"><img src="../assets/service_mngment.png" alt="Service Management" /></div>
          <span class="nav-label">Service Management</span>
        </a>
        <a href="analytics.html" class="nav-item">
          <div class="nav-icon"><img src="../assets/analytics.png" alt="Analytics" /></div>
          <span class="nav-label">Analytics</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <button class="btn-collapse" onclick="toggleSidebar()" title="Collapse sidebar">
        <img id="collapse-icon" src="../assets/collapse.png" alt="Collapse" />
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div id="profile-placeholder"></div>
    </header>

    <div class="content">
      <div class="header-group">
        <div class="title-area">
          <h1>Office Category List</h1>
          <p>Monitor and manage service information across Biñan city departments.</p>
        </div>
      </div>

      <div class="actions-row">
        <div class="search-input-wrapper">
          <div class="search-icon-embed">
            <img src="../assets/search.png" alt="Search icon" />
          </div>
          <input type="text" id="search-input" placeholder="Search office..." aria-label="Search city office updates" oninput="filterOffices(this.value)" />
        </div>

        <button type="button" class="btn-add-service" onclick="window.location.href='../Forms/add_service.html'">
          <img src="../assets/add_service.png" alt="Plus Icon" />
          <span>Add New Service</span>
        </button>
      </div>

      <div class="grid-container">
        <div class="office-grid" id="office-grid"></div>
        <p id="loading" style="text-align: center; color:#6b7a99; font-size:1rem; font-weight:600; margin-top:40px;">Loading offices...</p>
        <p id="no-results" style="display:none; text-align:center; color:#6b7a99; font-size:1rem; font-weight:600; margin-top:40px;">No offices found.</p>
      </div>

    </div>
  </div>

  <script type="module">
    import { auth, db } from '../Firebase/firebase-config.js';
    import { collection, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    window.handleSignOut = async function(e) {
      e.stopPropagation();
      const overlay = document.createElement('div');
      overlay.innerHTML = '<div style="position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:9999;"><div style="background:#fff;border-radius:20px;padding:40px 36px 32px;text-align:center;max-width:360px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.2);"><div style="width:48px;height:48px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;"><div style="width:48px;height:48px;border:4px solid rgba(42,125,225,0.2);border-top-color:#2a7de1;border-radius:50%;animation:spin 0.7s linear infinite;"></div></div><div style="font-size:1.3rem;font-weight:800;color:#1a2540;margin-bottom:8px;">Signing Out...</div><div style="font-size:0.88rem;color:#555;">Please wait.</div></div></div>';
      document.body.appendChild(overlay);
      await signOut(auth);
      window.location.href = '../Authentication/auth.html';
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '../Authentication/auth.html';
        return;
      }

      try {
        const adminDoc = await getDoc(doc(db, 'admin', user.uid));

        if (!adminDoc.exists()) {
          await signOut(auth);
          window.location.href = '../Authentication/auth.html';
          return;
        }

        const userNameEl = document.querySelector('.user-name');
        const userRoleEl = document.querySelector('.user-role');
        if (userNameEl) userNameEl.textContent = user.displayName || user.email;
        if (userRoleEl) userRoleEl.textContent = 'Admin ✓';
      } catch (error) {
        console.error('Auth check failed:', error);
        await signOut(auth);
        window.location.href = '../Authentication/auth.html';
      }
    });

    window.openOffice = function(officeName) {
      window.location.href = 'category_list.html?office=' + encodeURIComponent(officeName);
    };

    async function loadOffices() {
      const grid = document.getElementById('office-grid');
      const loadingText = document.getElementById('loading');
      
      try {
        loadingText.style.display = 'block';

        const querySnapshot = await getDocs(collection(db, "offices"));

        if (querySnapshot.empty) {
          loadingText.innerText = 'No offices found. Add one to get started!';
          return;
        } else {
          loadingText.style.display = 'none';
        }

        querySnapshot.forEach((doc) => {
          const officeData = doc.data();
          const cardHTML = `
            <div class="office-card" onclick="openOffice('${officeData.office_name}')">
              <h3 class="card-title" style="color: var(--navy);">${officeData.office_name}</h3>
            </div>
          `;
          grid.insertAdjacentHTML('beforeend', cardHTML);
        });

      } catch (error) {
        console.error("Error fetching offices: ", error);
        loadingText.innerText = 'Failed to load offices. Ensure you have admin access.';
      }
    }

    loadOffices();
  </script>
  
  <script>
    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('collapsed');
      const collapsed = document.querySelector('.sidebar').classList.contains('collapsed');
      const icon = document.getElementById('collapse-icon');
      icon.src = collapsed ? '../assets/collapse-right.png' : '../assets/collapse.png';
      icon.alt = collapsed ? 'Expand' : 'Collapse';
    }

    function filterOffices(query) {
      const q = query.trim().toLowerCase();
      const cards = document.querySelectorAll('#office-grid .office-card');
      let visible = 0;
      cards.forEach(card => {
        const name = card.querySelector('h3').textContent.toLowerCase();
        const show = name.includes(q);
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
    }

    function openOffice(name) {
      window.location.href = 'category_list.html?office=' + encodeURIComponent(name);
    }
  </script>

  <script>
    fetch('../Authentication/profile.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('profile-placeholder').innerHTML = html;
        if (window.currentUser) updateProfileDisplay(window.currentUser);
      });
</script>
</body>

</html>
