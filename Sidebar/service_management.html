<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaBayan – Service Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../assets/logo_whitebg.png" />
  <link rel="stylesheet" href="../css/service_management.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/profile.css" />
  <link rel="stylesheet" href="../css/toast.css" />
  <link rel="stylesheet" href="../css/page_transition.css" />
  <link rel="stylesheet" href="../css/add_office_modal.css" />
  <script src="../functions/toast.js"></script>
  <script type="module" src="../functions/role-guard.js"></script>
  <script src="../functions/sidebar.js"></script>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="../assets/logo.png" alt="GaBayan Logo" />
      </div>
      <div class="logo-text">
        <img src="../assets/docsease_text.png" alt="GaBayan" class="brand-img" />
      </div>
    </div>

    <div class="sidebar-nav-container">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <div class="nav-icon"><img src="../assets/dashboard.png" alt="Dashboard" /></div>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="service_management.html" class="nav-item active">
          <div class="nav-icon"><img src="../assets/service_mngment.png" alt="Service Management" /></div>
          <span class="nav-label">Service Management</span>
        </a>
        <a href="map_management.html" class="nav-item" title="Map Management">
          <div class="nav-icon"><img src="../assets/map_mngment.png" alt="Map Management" /></div>
          <span class="nav-label">Map Management</span>
        </a>
        <a href="analytics.html" class="nav-item">
          <div class="nav-icon"><img src="../assets/analytics.png" alt="Analytics" /></div>
          <span class="nav-label">Analytics</span>
        </a>
        <a href="review_queue.html" class="nav-item" title="Review Queue">
      <div class="nav-icon"><img src="../assets/review_queue.png" alt="Review Queue" /></div>
        <span class="nav-label">Review Queue</span>
      </a>
      <a href="activity_log.html" class="nav-item" title="Activity Log">
      <div class="nav-icon"><img src="../assets/activity_log.png" alt="Activity Log" /></div>
        <span class="nav-label">Activity Log</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <button class="btn-collapse" onclick="toggleSidebar()" title="Collapse sidebar">
        <img id="collapse-icon" src="../assets/collapse.png" alt="Collapse" />
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div id="profile-placeholder"></div>
    </header>

      <div class="content page-fade" id="main-content">
      <div class="header-group">
        <div class="title-area">
          <h1>Office Category List</h1>
          <p>Monitor and manage service information across Biñan city departments.</p>
        </div>
      </div>

      <div class="actions-row">
        <div class="search-input-wrapper">
          <div class="search-icon-embed">
            <img src="../assets/search.png" alt="Search icon" />
          </div>
          <input type="text" id="search-input" placeholder="Search office..." aria-label="Search city office updates" oninput="filterOffices(this.value)" />
        </div>

        <!-- Label set once role is known -->
        <button type="button" id="btn-add-service" class="btn-add-service" style="display:none;" onclick="window.location.href='../Forms/add_service.html'">
          <img src="../assets/add_service.png" alt="Plus Icon" />
          <span>Add New Service</span>
        </button>
        <button type="button" id="btn-add-office" class="btn-add-service" style="display:none;" onclick="openAddOffice()">
          <img src="../assets/add_service.png" alt="Plus Icon" />
          <span>Add New Office</span>
        </button>
      </div>

      <div class="grid-container">
        <div class="office-grid page-fade" id="office-grid"></div>
        <p id="loading" class="delayed-loading" style="text-align: center; color:#6b7a99; font-size:1rem; font-weight:600; margin-top:40px;">Loading offices...</p>
        <p id="no-results" style="display:none; text-align:center; color:#6b7a99; font-size:1rem; font-weight:600; margin-top:40px;">No offices found.</p>
      </div>

    </div>
  </div>

  <!-- Add New Office modal -->
  <div class="ao-overlay" id="add-office-overlay" aria-hidden="true">
    <div class="ao-modal" role="dialog" aria-modal="true" aria-labelledby="ao-title">
      <div class="ao-header">
        <h2 class="ao-title" id="ao-title">Add New Office</h2>
        <button type="button" class="ao-close" aria-label="Close" onclick="closeAddOffice()">&times;</button>
      </div>
    <div class="ao-body">
      <div class="ao-section">
        <div class="ao-section-title">Office Information</div>
        <div class="ao-field">
          <label class="ao-label" for="ao-office-name">Office Name</label>
          <input type="text" id="ao-office-name" class="ao-input" placeholder="Enter office name..." maxlength="100" autocomplete="off" />
        </div>

        <div class="ao-field">
          <label class="ao-label" for="ao-description">DESCRIPTION</label>
          <textarea id="ao-description" class="ao-input" rows="3" maxlength="500" placeholder="What does this office do?"></textarea>
        </div>

        <div class="ao-row">
          <div>
            <label class="ao-label" for="ao-floor">FLOOR</label>
            <select id="ao-floor" class="ao-input"></select>
          </div>
          <div>
            <label class="ao-label" for="ao-category">CATEGORY / TYPE</label>
            <select id="ao-category" class="ao-input"></select>
          </div>
        </div>
      </div>

      <div class="ao-section">
        <div class="ao-section-title">Office Schedule</div>
        <div class="ao-row">
          <div>
            <label class="ao-label" for="ao-day-from">DAY FROM</label>
            <select id="ao-day-from" class="ao-input"></select>
          </div>
          <div>
            <label class="ao-label" for="ao-day-to">DAY TO <span class="ao-hint">(optional)</span></label>
            <select id="ao-day-to" class="ao-input"></select>
          </div>
        </div>

        <div class="ao-row">
          <div>
            <label class="ao-label" for="ao-open-time">OPENING TIME</label>
            <input type="time" id="ao-open-time" class="ao-input" />
          </div>
          <div>
            <label class="ao-label" for="ao-close-time">CLOSING TIME</label>
            <input type="time" id="ao-close-time" class="ao-input" />
          </div>
        </div>
      </div>

      <div class="ao-error" id="ao-error"></div>
    </div>
      <div class="ao-actions">
        <button type="button" class="ao-btn ao-btn-cancel" onclick="closeAddOffice()">Cancel</button>
        <button type="button" class="ao-btn ao-btn-add" id="ao-submit" onclick="submitAddOffice()">Add new office</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '../Firebase/firebase-config.js';
    import { collection, getDocs, getDoc, doc, deleteDoc, setDoc, addDoc, serverTimestamp, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    // Activity log helper
    let _logActor = null;
    let _superAdminUids = null;

    async function getSuperAdminUids() {
      if (_superAdminUids) return _superAdminUids;
      try {
        const snap = await getDoc(doc(db, 'app_settings', 'super_admin'));
        _superAdminUids = snap.exists() ? (snap.data().uids || []) : [];
      } catch (err) {
        console.error('[activity-log] could not read super admin list:', err);
        return [];
      }
      return _superAdminUids;
    }

    async function logActivity(type, details = {}) {
      try {
        const user = auth.currentUser;
        if (!user) return;

        if (!_logActor || _logActor.uid !== user.uid) {
          let name = user.displayName || user.email || 'Admin';
          let role = 'admin';
          try {
            const snap = await getDoc(doc(db, 'admin', user.uid));
            if (snap.exists()) {
              const data = snap.data();
              name = data.full_name || name;
              role = data.role || 'admin';
            }
          } catch (err) {
            console.error('[activity-log] could not read actor profile:', err);
          }
          _logActor = { uid: user.uid, name, role };
        }

        const recipients = new Set(await getSuperAdminUids());
        if (details.recipient_uid === 'all_admins') {
          if (_logActor.role === 'super_admin') {
            const adminsSnap = await getDocs(query(collection(db, 'admin'), where('status', '==', 'active')));
            adminsSnap.forEach(d => recipients.add(d.id));
          }
        } else if (details.recipient_uid) {
          recipients.add(details.recipient_uid);
        }
        if (!recipients.size) {
          console.warn('[activity-log] no recipients - check app_settings/super_admin');
          return;
        }

        const payload = {
          type,
          actor_uid: _logActor.uid,
          actor_name: details.actor_name || _logActor.name,
          actor_role: _logActor.role,
          office_name: details.office_name || '',
          service_name: details.service_name || '',
          target_name: details.target_name || '',
          target_uid: details.target_uid || '',
          createdAt: serverTimestamp()
        };

        const uids = [...recipients];
        for (let i = 0; i < uids.length; i += 400) {
          const batch = writeBatch(db);
          uids.slice(i, i + 400).forEach(uid => {
            batch.set(doc(collection(db, 'admin', uid, 'activity_logs')), payload);
          });
          await batch.commit();
        }
      } catch (err) {
        console.error('[activity-log] failed to log', type, err);
      }
    }
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    let isSuperAdmin = false;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '../Authentication/auth.html';
        return;
      }

      try {
        const adminDoc = await getDoc(doc(db, 'admin', user.uid));

        if (!adminDoc.exists()) {
          await signOut(auth);
          window.location.href = '../Authentication/auth.html';
          return;
        }

        const userNameEl = document.querySelector('.user-name');
        const userRoleEl = document.querySelector('.user-role');
        if (userNameEl) userNameEl.textContent = user.displayName || user.email;
        if (userRoleEl) userRoleEl.textContent = 'Admin ✓';

        const adminData = adminDoc.data();
        isSuperAdmin = adminData.role === 'super_admin' && adminData.status === 'active';

        // Regular admin: skip the office list and open their own office directly
        if (!isSuperAdmin) {
          const myOffice = (adminData.admin_office || '').trim();
          if (myOffice) {
            window.location.replace('category_list.html?office=' + encodeURIComponent(myOffice));
            return;
          }
          // No office assigned (older account): show a message instead of the list
          document.getElementById('main-content').classList.add('is-ready');
          document.getElementById('loading').innerText =
            'Your account has no office assigned yet. Please contact the Super Admin.';
          return;
        }

        document.getElementById('main-content').classList.add('is-ready');
        document.getElementById('btn-add-office').style.display = '';

        // Load offices after role is known
        loadOffices();
      } catch (error) {
        console.error('Auth check failed:', error);
        await signOut(auth);
        window.location.href = '../Authentication/auth.html';
      }
    });

    window.openOffice = function(officeName) {
      window.location.href = 'category_list.html?office=' + encodeURIComponent(officeName);
    };

    async function loadOffices() {
      const grid = document.getElementById('office-grid');
      const loadingText = document.getElementById('loading');

      try {
        grid.innerHTML = '';
        grid.classList.remove('is-ready');
        loadingText.innerText = 'Loading offices...';
        loadingText.style.display = 'block';

        const querySnapshot = await getDocs(collection(db, "offices"));

        if (querySnapshot.empty) {
          loadingText.innerText = 'No offices found. Add one to get started!';
          return;
        } else {
          loadingText.style.display = 'none';
        }

        // Build all cards first, then insert and fade them in together
        let cardsHTML = '';
        querySnapshot.forEach((officeDoc) => {
          const officeData = officeDoc.data();
          const officeName = officeData.office_name || officeDoc.id;
          const cardHTML = `
            <div class="office-card" data-office-name="${escapeHtml(officeName)}">
              ${isSuperAdmin ? `
              <button class="btn-delete-office" type="button" title="Delete office category" aria-label="Delete ${escapeHtml(officeName)}" onclick="deleteOffice('${officeDoc.id}', this, event)">
                <img src="../assets/delete.png" alt="" />
              </button>` : ''}
              <h3 class="card-title" style="color: var(--navy);">${escapeHtml(officeName)}</h3>
            </div>
          `;
          cardsHTML += cardHTML;
        });

        grid.innerHTML = cardsHTML;
        requestAnimationFrame(() => grid.classList.add('is-ready'));

      } catch (error) {
        console.error("Error fetching offices: ", error);
        loadingText.innerText = 'Failed to load offices. Ensure you have admin access.';
      }
    }

    window.escapeHtml = function(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    };

    //Add New Office 
    const AO_FLOORS = [['first_floor', 'First Floor'], ['second_floor', 'Second Floor'], ['third_floor', 'Third Floor']];
    const AO_CATEGORIES = [['regular_service', 'Regular Service'], ['emergency_services', 'Emergency Services'], ['building_access', 'Building Access'], ['facilities_and_amenities', 'Facilities and Amenities'], ['comfort_rooms', 'Comfort Rooms'], ['suites_and_hubs', 'Suites and Hubs']];

    const aoOverlay = document.getElementById('add-office-overlay');
    const aoInput = document.getElementById('ao-office-name');
    const aoDesc = document.getElementById('ao-description');
    const aoFloor = document.getElementById('ao-floor');
    const aoCategory = document.getElementById('ao-category');
    const aoError = document.getElementById('ao-error');
    const aoSubmit = document.getElementById('ao-submit');
    const aoOpen = document.getElementById('ao-open-time');
    const aoClose = document.getElementById('ao-close-time');
    const aoDayFrom = document.getElementById('ao-day-from');
    const aoDayTo = document.getElementById('ao-day-to');
    const aoFields = [aoInput, aoDesc, aoFloor, aoCategory, aoDayFrom, aoDayTo, aoOpen, aoClose];
    aoFields.forEach(f => f.addEventListener('input', () => showAoError('')));

    function fillAoSelect(select, placeholder, options) {
      select.innerHTML = `<option value="" disabled selected>${placeholder}</option>` +
        options.map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
    }
    fillAoSelect(aoFloor, 'Select floor', AO_FLOORS);
    fillAoSelect(aoCategory, 'Select category', AO_CATEGORIES);

    const SCHED_DAYS = [['Mon', 'Monday'], ['Tue', 'Tuesday'], ['Wed', 'Wednesday'], ['Thu', 'Thursday'], ['Fri', 'Friday'], ['Sat', 'Saturday'], ['Sun', 'Sunday']];
    const schedFmtTime = (hhmm) => {
      const [h, m] = hhmm.split(':').map(Number);
      const ap = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return m ? `${h12}:${String(m).padStart(2, '0')}${ap}` : `${h12}${ap}`;
    };
    const schedTo24 = (h, m, ap) => { 
      let hh = Number(h) % 12;
      if (/pm/i.test(ap)) hh += 12;
      return `${String(hh).padStart(2, '0')}:${String(m || '00').padStart(2, '0')}`;
    };
    const buildSchedule = (dayFrom, dayTo, openTime, closeTime) =>
      `${dayTo && dayTo !== dayFrom ? `${dayFrom}-${dayTo}` : dayFrom}, ${schedFmtTime(openTime)}-${schedFmtTime(closeTime)}`;
    const parseSchedule = (s) => {
      const m = String(s || '').match(/^\s*([A-Za-z]{3})(?:\s*-\s*([A-Za-z]{3}))?\s*,?\s*(\d{1,2})(?::(\d{2}))?\s*(AM|PM)\s*-\s*(\d{1,2})(?::(\d{2}))?\s*(AM|PM)\s*$/i);
      if (!m) return null;
      const cap = (d) => d ? d.charAt(0).toUpperCase() + d.slice(1).toLowerCase() : '';
      return { dayFrom: cap(m[1]), dayTo: cap(m[2]), open: schedTo24(m[3], m[4], m[5]), close: schedTo24(m[6], m[7], m[8]) };
    };
    const schedDayOptions = (placeholder, toSelect) =>
      `<option value=""${toSelect ? '' : ' disabled'} selected>${placeholder}</option>` +
      SCHED_DAYS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
    aoDayFrom.innerHTML = schedDayOptions('Select day', false);
    aoDayTo.innerHTML = schedDayOptions('Same day', true);

    function showAoError(message, field) {
      aoError.textContent = message;
      aoFields.forEach(f => f.classList.remove('error'));
      if (message && field) field.classList.add('error');
    }

    window.openAddOffice = function() {
      aoInput.value = '';
      aoDesc.value = '';
      aoFloor.selectedIndex = 0;
      aoCategory.selectedIndex = 0;
      aoDayFrom.selectedIndex = 0;
      aoDayTo.selectedIndex = 0;
      aoOpen.value = '';
      aoClose.value = '';
      showAoError('');
      aoOverlay.classList.add('show');
      aoOverlay.setAttribute('aria-hidden', 'false');
      setTimeout(() => aoInput.focus(), 0);
    };

    window.closeAddOffice = function() {
      aoOverlay.classList.remove('show');
      aoOverlay.setAttribute('aria-hidden', 'true');
    };

    window.submitAddOffice = async function() {
      const officeName = aoInput.value.replace(/\s+/g, ' ').trim();
      const description = aoDesc.value.trim();
      const floor = aoFloor.value;
      const category = aoCategory.value;
      const dayFrom = aoDayFrom.value;
      const dayTo = aoDayTo.value;
      const openTime = aoOpen.value;
      const closeTime = aoClose.value;

      if (!officeName) { showAoError('Please enter an office name.', aoInput); return; }
      if (officeName.includes('/')) { showAoError('Office name cannot contain "/".', aoInput); return; }
      if (!description) { showAoError('Please enter a description.', aoDesc); return; }
      if (!floor) { showAoError('Please select a floor.', aoFloor); return; }
      if (!category) { showAoError('Please select a category.', aoCategory); return; }
      if (!dayFrom) { showAoError('Please select a day.', aoDayFrom); return; }
      if (!openTime) { showAoError('Please enter an opening time.', aoOpen); return; }
      if (!closeTime) { showAoError('Please enter a closing time.', aoClose); return; }
      if (openTime === closeTime) { showAoError('Opening and closing time cannot be the same.', aoClose); return; }
      showAoError('');

      const isOffice = category === 'regular_service';
      const targetCollection = isOffice ? 'offices' : 'other_room';
      const nameField = isOffice ? 'office_name' : 'room_name';

      aoSubmit.disabled = true;
      aoSubmit.textContent = 'Adding...';
      let step = 'starting';

      try {
        const officeId = officeName.toUpperCase().replace(/\s+/g, '-');

        step = 'checking for duplicates';
        const readDocs = async (name) => {
          try { return (await getDocs(collection(db, name))).docs; }
          catch (err) { console.warn(`[add-office] could not read "${name}":`, err); return []; }
        };
        const [officeDocs, roomDocs] = await Promise.all([readDocs('offices'), readDocs('other_room')]);
        const duplicate = [...officeDocs, ...roomDocs].some(d => {
          const data = d.data();
          return d.id === officeId ||
            String(data.office_name || data.room_name || d.id).trim().toLowerCase() === officeName.toLowerCase();
        });
        if (duplicate) {
          showAoError('An office or room with this name already exists.', aoInput);
          return;
        }

        step = `saving to "${targetCollection}"`;
        await setDoc(doc(db, targetCollection, officeId), {
          [nameField]: officeName,
          description,
          floor,
          category,
          schedule: buildSchedule(dayFrom, dayTo, openTime, closeTime),
          created_at: serverTimestamp()
        });

        await logActivity('office_added', { office_name: officeName });

        window.closeAddOffice();
        window.showToast('success', isOffice ? 'Office Added' : 'Room Added', `"${officeName}" has been added.`, 'OK');
        await loadOffices();
      } catch (error) {
        console.error(`[add-office] failed while ${step}:`, error);
        const denied = error && error.code === 'permission-denied';
        window.showToast('error', 'Add Failed',
          denied
            ? `Firestore rules blocked this while ${step}. Allow super admins to write to this collection.`
            : `The office could not be added (${step}). ${error && error.code ? error.code : 'Please try again.'}`,
          'OK');
      } finally {
        aoSubmit.disabled = false;
        aoSubmit.textContent = 'Add new office';
      }
    };

    aoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') window.submitAddOffice(); });
    aoFields.forEach(f => f.addEventListener('input', () => showAoError('')));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && aoOverlay.classList.contains('show')) window.closeAddOffice(); });

    window.deleteOffice = async function(officeId, button, event) {
      event.stopPropagation();
      if (!isSuperAdmin) return;

      const officeCard = button.closest('.office-card');
      const officeName = officeCard.querySelector('.card-title').textContent;
      window.showConfirmToast({
        type: 'warning',
        title: 'Delete Office Category?',
        msg: `This will permanently delete "${officeName}" and all of its services.`,
        confirmText: 'Yes, Delete',
        cancelText: 'No',
        onConfirm: async () => {
          button.disabled = true;
          window.showToast('loading', 'Deleting Office Category', 'The office category and its services are being deleted.', '');

          try {
            const servicesRef = collection(db, 'offices', officeId, 'services');
            const servicesSnapshot = await getDocs(servicesRef);
            await Promise.all(servicesSnapshot.docs.map(serviceDoc => deleteDoc(serviceDoc.ref)));
            await deleteDoc(doc(db, 'offices', officeId));
            await logActivity('office_deleted', { office_name: officeName });
            officeCard.remove();
            window.showToast('success', 'Deletion Successful', `"${officeName}" and all of its services have been deleted.`, 'OK');
          } catch (error) {
            console.error('Error deleting office category:', error);
            button.disabled = false;
            window.showToast('error', 'Delete Failed', 'The office category could not be deleted. Please try again.', 'OK');
          }
        }
      });
    };
  </script>
  
  <script>
    function filterOffices(query) {
      const q = query.trim().toLowerCase();
      const cards = document.querySelectorAll('#office-grid .office-card');
      let visible = 0;
      cards.forEach(card => {
        const name = card.querySelector('h3').textContent.toLowerCase();
        const show = name.includes(q);
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
    }

    function openOffice(name) {
      window.location.href = 'category_list.html?office=' + encodeURIComponent(name);
    }

    document.getElementById('office-grid').addEventListener('click', event => {
      if (!event.target.closest('.btn-delete-office')) {
        const card = event.target.closest('.office-card');
        if (card) openOffice(card.dataset.officeName);
      }
    });
  </script>

  <script>
    fetch('../Authentication/profile.html')
      .then(res => res.text())
      .then(html => {
        const template = document.createElement('template');
        template.innerHTML = html;
        const script = template.content.querySelector('script');
        const profilePlaceholder = document.getElementById('profile-placeholder');
        profilePlaceholder.replaceChildren(template.content);
        if (script) {
          const executableScript = document.createElement('script');
          executableScript.textContent = script.textContent;
          document.body.appendChild(executableScript);
        }
        if (window.currentUser) updateProfileDisplay(window.currentUser);
      });
</script>
</body>

</html>
