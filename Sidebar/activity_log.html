<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaBayan – Activity Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="../assets/logo_whitebg.png" />
  <link rel="stylesheet" href="../css/activity_log.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/profile.css" />
  <link rel="stylesheet" href="../css/toast.css" />
  <script src="../functions/toast.js"></script>
  <script type="module" src="../functions/role-guard.js"></script>
  <script src="../functions/sidebar.js"></script>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="../assets/logo.png" alt="GaBayan Logo" />
      </div>
      <div class="logo-text">
        <img src="../assets/docsease_text.png" alt="GaBayan" class="brand-img" />
      </div>
    </div>

    <div class="sidebar-nav-container">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" title="Dashboard">
          <div class="nav-icon"><img src="../assets/dashboard.png" alt="Dashboard" /></div>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="service_management.html" class="nav-item" title="Service Management">
          <div class="nav-icon"><img src="../assets/service_mngment.png" alt="Service Management" /></div>
          <span class="nav-label">Service Management</span>
        </a>
        <a href="map_management.html" class="nav-item" title="Map Management">
          <div class="nav-icon"><img src="../assets/map_mngment.png" alt="Map Management" /></div>
          <span class="nav-label">Map Management</span>
        </a>
        <a href="analytics.html" class="nav-item" title="Analytics">
          <div class="nav-icon"><img src="../assets/analytics.png" alt="Analytics" /></div>
          <span class="nav-label">Analytics</span>
        </a>
        <a href="review_queue.html" class="nav-item" title="Review Queue">
          <div class="nav-icon"><img src="../assets/review_queue.png" alt="Review Queue" /></div>
          <span class="nav-label">Review Queue</span>
        </a>

        <a href="account_management.html" class="nav-item" title="Account Management">
          <div class="nav-icon"><img src="../assets/account_management.svg" alt="Account Management" /></div>
          <span class="nav-label">Account Management</span>
        </a>
        <a href="activity_log.html" class="nav-item active" title="Activity Log">
          <div class="nav-icon"><img src="../assets/activity_log.png" alt="Activity Log" /></div>
          <span class="nav-label">Activity Log</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <button class="btn-collapse" onclick="toggleSidebar()" title="Collapse sidebar">
        <img id="collapse-icon" src="../assets/collapse.png" alt="Collapse" />
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="search-input-wrapper">
        <div class="search-icon-embed">
          <img src="../assets/search.png" alt="Search icon" />
        </div>
        <input type="text" id="search-input" placeholder="Search activity..." aria-label="Search activity log" autocomplete="off" />
      </div>
      <div id="profile-placeholder"></div>
    </header>

    <div class="content">
      <div class="log-card">
        <div class="log-toolbar">
          <div class="log-tabs" id="log-tabs">
            <button type="button" class="log-tab active" data-tab="all">All</button>
            <button type="button" class="log-tab" data-tab="today">Today</button>
            <button type="button" class="log-tab" data-tab="week">This Week</button>
            <button type="button" class="log-tab" data-tab="month">This Month</button>
          </div>
          <button type="button" class="btn-delete-selected" id="btn-delete-selected" title="Delete selected logs" aria-label="Delete selected logs">
            <img src="../assets/delete.png" alt="" />
          </button>
        </div>

        <div class="log-list" id="log-list">
          <div class="log-empty">Loading activity…</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '../Firebase/firebase-config.js';
    import { collection, query, orderBy, limit, onSnapshot, doc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const MAX_LOGS = 300; // max logs loaded

    let currentUid = null;
    let isSuperAdmin = false; // role flag
    let logs = []; // loaded logs
    let activeTab = 'all';
    let searchTerm = '';
    const selected = new Set();

    // ---------- Access ----------
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '../Authentication/auth.html';
        return;
      }
      try {
        const snap = await getDoc(doc(db, 'admin', user.uid));
        const data = snap.exists() ? snap.data() : null;

        if (!data || data.status !== 'active') {
          await signOut(auth);
          window.location.href = '../Authentication/auth.html';
          return;
        }
        isSuperAdmin = data.role === 'super_admin';
        currentUid = user.uid;
        startListening();
      } catch (error) {
        console.error('Auth check failed:', error);
        window.location.href = '../Authentication/auth.html';
      }
    });

    // ---------- Wording ----------
    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[ch]));
    }

    // Wording per role
    function describeForAdmin(log) {
      const office = log.office_name ? `the ${log.office_name}` : 'an office';
      const svc = log.service_name ? `"${log.service_name}"` : 'a service';
      switch (log.type) {
        case 'office_added':
          return { title: 'Hi there! A new office was added.',
                   desc: `The Super Admin added ${office} successfully. Check it out.` };
        case 'admin_account_accepted':
          return { title: 'Hi there! Your request was accepted.',
                   desc: `The Super Admin accepted your admin account request for ${office}. Welcome aboard!` };
        case 'service_delete_accepted':
          return { title: 'Hi there! Your request was accepted.',
                   desc: `The Super Admin accepted your request to delete ${svc} in ${office}.` };
        case 'service_delete_declined':
          return { title: 'Hi there! Your request was declined.',
                   desc: `The Super Admin declined your request to delete ${svc} in ${office}.` };
        default:
          return { title: 'Hi there! New activity.', desc: '' };
      }
    }

    function describe(log) {
      if (!isSuperAdmin) return describeForAdmin(log);
      const isMe = log.actor_uid === currentUid;
      const name = log.actor_name || 'An admin';
      const admin = isMe ? 'You' : `Admin ${name}`;
      const office = log.office_name ? `the ${log.office_name}` : 'an office';
      const svc = log.service_name ? `"${log.service_name}"` : 'a service';
      const target = log.target_name || 'an admin';

      switch (log.type) {
        case 'service_added':
          return { title: 'Hi there! A new service added.',
                   desc: `${admin} added ${log.service_name ? svc : 'a new service'} in ${office}. Check it out.` };
        case 'service_updated':
          return { title: 'Hi there! A service was updated.',
                   desc: `${admin} updated ${svc} in ${office}.` };
        case 'service_deleted':
          return { title: 'Hi there! A service has been deleted.',
                   desc: `${admin} deleted ${svc} in ${office}.` };
        case 'service_delete_requested':
          return { title: 'Hi there! A delete request was sent.',
                   desc: `${admin} requested to delete ${svc} in ${office}.` };
        case 'service_delete_accepted':
          return { title: 'Hi there! Accepted a request.',
                   desc: `${isMe ? 'You' : name} accepted the deletion of ${svc} in ${office}.` };
        case 'service_delete_declined':
          return { title: 'Hi there! Declined a request.',
                   desc: `${isMe ? 'You' : name} declined the request to delete ${svc} in ${office}.` };
        case 'office_added':
          return { title: 'Hi there! Added an office.',
                   desc: `${isMe ? 'You' : name} added ${office} successfully. Check it out.` };
        case 'office_deleted':
          return { title: 'Hi there! Deleted an office.',
                   desc: `${isMe ? 'You' : name} deleted ${office}.` };
        case 'admin_account_requested':
          return { title: 'Hi there! New admin request.',
                   desc: `${name} requested an admin account for ${office}.` };
        case 'admin_account_accepted':
          return { title: 'Hi there! Accepted a request.',
                   desc: `${isMe ? 'You' : name} accepted a new admin account named ${target} for ${office}.` };
        case 'admin_account_declined':
          return { title: 'Hi there! Declined a request.',
                   desc: `${isMe ? 'You' : name} declined the admin account request of ${target} for ${office}.` };
        case 'user_account_deactivated':
          return { title: 'Hi there! Deactivated a user.',
                   desc: `${isMe ? 'You' : name} deactivated the mobile user account of ${log.target_name || 'a user'}.` };
        case 'user_account_reactivated':
          return { title: 'Hi there! Reactivated a user.',
                   desc: `${isMe ? 'You' : name} reactivated the mobile user account of ${log.target_name || 'a user'}.` };
        case 'admin_account_deactivated':
          return { title: 'Hi there! Deactivated an admin.',
                   desc: `${isMe ? 'You' : name} deactivated the admin account of ${target}${log.office_name ? ' for ' + office : ''}.` };
        case 'admin_account_reactivated':
          return { title: 'Hi there! Reactivated an admin.',
                   desc: `${isMe ? 'You' : name} reactivated the admin account of ${target}${log.office_name ? ' for ' + office : ''}.` };
        default:
          return { title: 'Hi there! New activity.', desc: '' };
      }
    }

    function timeAgo(date) {
      if (!date) return '';
      const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
      if (seconds < 45) return 'just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} min${minutes === 1 ? '' : 's'} ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days} day${days === 1 ? '' : 's'} ago`;
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function tabStart(tab) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (tab === 'today') return today;
      if (tab === 'week') { // starts Monday
        const d = new Date(today);
        d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        return d;
      }
      if (tab === 'month') return new Date(now.getFullYear(), now.getMonth(), 1);
      return null;
    }

    // ---------- Live data ----------
    function startListening() {
      // Each admin reads only their own activity log copies
      const q = query(
        collection(db, 'admin', currentUid, 'activity_logs'),
        orderBy('createdAt', 'desc'),
        limit(MAX_LOGS)
      );
      onSnapshot(q, (snap) => {
        logs = snap.docs.map(d => {
          const data = d.data({ serverTimestamps: 'estimate' });
          const ts = data.createdAt;
          return { id: d.id, ...data, _date: ts && typeof ts.toDate === 'function' ? ts.toDate() : null };
        });
        logs.sort((a, b) => (b._date ? b._date.getTime() : Infinity) - (a._date ? a._date.getTime() : Infinity));
        logs = logs.slice(0, MAX_LOGS);
        for (const id of [...selected]) if (!logs.some(l => l.id === id)) selected.delete(id);
        render();
      }, (error) => {
        console.error('Failed to load activity log:', error);
        document.getElementById('log-list').innerHTML = '<div class="log-empty">Couldn\'t load the activity log. Please refresh.</div>';
      });
    }

    // Delete permissions
    function canDelete() {
      return !!currentUid; // every log in your own feed is yours to delete
    }

    // ---------- Render ----------
    function visibleLogs() {
      const start = tabStart(activeTab);
      const term = searchTerm.trim().toLowerCase();
      return logs.filter(log => {
        if (start && (!log._date || log._date < start)) return false;
        if (!term) return true;
        const { title, desc } = describe(log);
        return `${title} ${desc}`.toLowerCase().includes(term);
      });
    }

    function render() {
      const list = document.getElementById('log-list');
      const items = visibleLogs();

      if (!items.length) {
        list.innerHTML = `<div class="log-empty">${logs.length ? 'No activity matches your filters.' : 'No activity yet.'}</div>`;
      } else {
        list.innerHTML = items.map(log => {
          const { title, desc } = describe(log);
          const isSelected = selected.has(log.id);
          const deletable = canDelete(log);
          return `
            <div class="log-row ${isSelected ? 'selected' : ''}" data-id="${escapeHtml(log.id)}">
              <input type="checkbox" class="log-check" aria-label="Select log" ${isSelected ? 'checked' : ''} ${deletable ? '' : 'style="visibility:hidden" disabled'} />
              <div class="log-text">
                <span class="log-title">${escapeHtml(title)}</span><span class="log-desc">${escapeHtml(desc)}</span>
              </div>
              <div class="log-time">${escapeHtml(timeAgo(log._date))}</div>
              <button type="button" class="log-row-delete" title="Delete log" aria-label="Delete log" ${deletable ? '' : 'style="visibility:hidden" disabled'}>
                <img src="../assets/delete.png" alt="" />
              </button>
            </div>`;
        }).join('');
      }

      document.getElementById('btn-delete-selected').classList.toggle('active', selected.size > 0);
    }

    // ---------- Deleting ----------
    function confirmDelete(ids) {
      ids = ids.filter(id => { const l = logs.find(x => x.id === id); return l && canDelete(l); });
      if (!ids.length) return;
      const many = ids.length > 1;

      window.showConfirmToast({
        type: 'warning',
        title: many ? 'Delete Activity Logs?' : 'Delete Activity Log?',
        msg: many
          ? `This will permanently delete ${ids.length} activity logs.`
          : 'This will permanently delete this activity log.',
        confirmText: 'Yes, Delete',
        cancelText: 'Cancel',
        onConfirm: async () => {
          window.showToast('loading', 'Deleting', 'Removing the selected activity logs.', '');
          try {
            for (let i = 0; i < ids.length; i += 400) {
              const batch = writeBatch(db);
              ids.slice(i, i + 400).forEach(id => batch.delete(doc(db, 'admin', currentUid, 'activity_logs', id)));
              await batch.commit();
            }
            ids.forEach(id => selected.delete(id));
            window.showToast('success', 'Deleted', many ? `${ids.length} activity logs were deleted.` : 'The activity log was deleted.', 'OK');
          } catch (error) {
            console.error('Delete failed:', error);
            window.showToast('error', 'Delete Failed', 'The activity log could not be deleted (' + (error.code || error.message) + ').', 'OK');
          }
        }
      });
    }

    // ---------- Events ----------
    document.getElementById('log-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.log-tab');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.log-tab').forEach(t => t.classList.toggle('active', t === btn));
      render();
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchTerm = e.target.value;
      render();
    });

    document.getElementById('log-list').addEventListener('click', (e) => {
      const row = e.target.closest('.log-row');
      if (!row) return;
      const id = row.dataset.id;

      if (e.target.closest('.log-row-delete')) {
        confirmDelete([id]);
      } else if (e.target.classList.contains('log-check')) {
        if (e.target.checked) selected.add(id); else selected.delete(id);
        row.classList.toggle('selected', e.target.checked);
        document.getElementById('btn-delete-selected').classList.toggle('active', selected.size > 0);
      }
    });

    document.getElementById('btn-delete-selected').addEventListener('click', () => {
      if (!selected.size) {
        window.showToast('info', 'Nothing Selected', 'Tick the logs you want to delete first.', 'OK');
        return;
      }
      confirmDelete([...selected]);
    });

    // keep timestamps fresh
    setInterval(render, 60000);
  </script>

  <script>
    fetch('../Authentication/profile.html')
      .then(res => res.text())
      .then(html => {
        const template = document.createElement('template');
        template.innerHTML = html;
        const script = template.content.querySelector('script');
        const profilePlaceholder = document.getElementById('profile-placeholder');
        profilePlaceholder.replaceChildren(template.content);
        if (script) {
          const executableScript = document.createElement('script');
          executableScript.textContent = script.textContent;
          document.body.appendChild(executableScript);
        }
        if (window.currentUser) updateProfileDisplay(window.currentUser);
      });
  </script>
</body>

</html>
