<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocsEase – Category List</title>
  <link rel="icon" type="image/png" href="../assets/logo_whitebg.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #002D62;
      --sidebar-bg: #ffffff;
      --main-bg: #dce8f5;
      --card-bg: #ffffff;
      --text-dark: #0d1f3c;
      --text-muted: #6b7a99;
      --active-bg: #e8eef8;
      --shadow: 0 8px 24px rgba(10, 30, 80, 0.08);
      --btn-blue: #406AAF;
    }

    body,
    input,
    button,
    a {
      font-family: 'Inter', sans-serif;
    }

    body {
      height: 100vh;
      max-height: 100vh;
      display: flex;
      background: var(--main-bg);
      overflow: hidden;
    }

    .sidebar {
      width: 310px;
      min-width: 310px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 28px 0 24px 0;
      box-shadow: 2px 0 12px rgba(10, 30, 80, 0.07);
      z-index: 10;
      height: 100%;
      transition: width 0.25s ease, min-width 0.25s ease;
      overflow: hidden;
    }

    .sidebar.collapsed {
      width: 72px;
      min-width: 72px;
    }

    .sidebar.collapsed .sidebar-logo {
      padding: 0 0 32px 0;
      justify-content: center;
    }

    .sidebar.collapsed .nav-item {
      justify-content: center;
      padding: 14px;
    }

    .logo-text,
    .nav-label {
      overflow: hidden;
      white-space: nowrap;
      opacity: 1;
      max-width: 200px;
      transition: opacity 0.25s ease, max-width 0.25s ease;
    }

    .sidebar.collapsed .logo-text,
    .sidebar.collapsed .nav-label {
      opacity: 0;
      max-width: 0;
    }

    .btn-collapse {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0.6;
      transition: opacity 0.18s;
    }

    .btn-collapse:hover {
      opacity: 1;
    }

    .btn-collapse img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .sidebar.collapsed .btn-collapse {
      margin-left: 0;
    }

    .sidebar-bottom {
      padding: 12px 16px;
      margin-top: auto;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 28px 32px 28px;
    }

    .sidebar-logo .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-logo .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sidebar-logo .logo-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1;
    }

    .sidebar-logo .brand-img {
      height: 17px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .sidebar-nav-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--active-bg);
    }

    .nav-item .nav-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-item .nav-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .nav-item .nav-label {
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px 0 40px;
      flex-shrink: 0;
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy);
      padding: 8px 0;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .btn-back:hover {
      opacity: 0.6;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      position: relative;
    }

    .profile-dropdown {
      position: absolute;
      top: 54px;
      right: 0;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      min-width: 180px;
      padding: 8px 0;
      display: none;
      z-index: 100;
    }
    .profile-dropdown.show { display: block; }
    .profile-dropdown .dd-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .profile-dropdown .dd-item:hover { background: #f0f4fb; }
    .profile-dropdown .dd-item.disabled { opacity: 0.4; cursor: not-allowed; }
    .profile-dropdown .dd-item.disabled:hover { background: none; }
    .profile-dropdown .dd-divider { height: 1px; background: #e8eef8; margin: 4px 0; }
    .profile-dropdown .dd-item.logout { color: #e74c3c; }

    .user-info {
      text-align: right;
      line-height: 1.2;
    }

    .user-info .user-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .user-info .user-role {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow: hidden;
      background: #d9d9d9;
      flex-shrink: 0;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content {
      flex: 1;
      padding: 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow: hidden;
    }

    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
    }

    .title-area h2 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #000;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .title-area p {
      font-size: 0.95rem;
      color: #4a4a4a;
      font-weight: 500;
    }

    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      flex-shrink: 0;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
      max-width: 370px;
    }

    .search-input-wrapper input {
      width: 100%;
      height: 46px;
      background: #ffffff;
      border: 1px solid #b5acac;
      border-radius: 30px;
      padding: 0 16px 0 65px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-input-wrapper input:focus {
      border-color: #2057CE;
      background-color: #f0f4fb;
    }

    .search-input-wrapper input::placeholder {
      color: #9ba6b9;
    }

    .search-icon-embed {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-icon-embed img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .btn-add-service {
      height: 52px;
      padding: 0 24px;
      background: linear-gradient(to right, #0a3966, #3b7bb5);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(10, 40, 90, 0.15);
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .btn-add-service:hover {
      opacity: 0.90;
    }

    .btn-add-service img {
      height: 18px;
      width: auto;
      object-fit: contain;
    }

    .panel-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 25px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .services-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 20px;
    }

    .services-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .services-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .services-scroll::-webkit-scrollbar-thumb {
      background: rgba(13, 31, 60, 0.15);
      border-radius: 10px;
    }

    .services-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(13, 31, 60, 0.3);
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
    }

    .service-card {
      background: var(--btn-blue);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 500;
      padding: 44px 40px;
      text-align: center;
      cursor: pointer;
      line-height: 1.4;
      transition: opacity 0.2s, transform 0.2s;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-card:hover {
      opacity: 0.88;
      transform: translateY(-2px);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="../assets/logo.png" alt="DocsEase Logo" />
      </div>
      <div class="logo-text">
        <img src="../assets/docsease_text.png" alt="DocsEase" class="brand-img" />
      </div>
    </div>

    <div class="sidebar-nav-container">
      <nav class="sidebar-nav">
        <a href="../Sidebar/dashboard.html" class="nav-item">
          <div class="nav-icon"><img src="../assets/dashboard.png" alt="Dashboard" /></div>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="../Sidebar/service_management.html" class="nav-item active">
          <div class="nav-icon"><img src="../assets/service_mngment.png" alt="Service Management" /></div>
          <span class="nav-label">Service Management</span>
        </a>

        <a href="../Sidebar/analytics.html" class="nav-item">
          <div class="nav-icon"><img src="../assets/analytics.png" alt="Analytics" /></div>
          <span class="nav-label">Analytics</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <button class="btn-collapse" onclick="toggleSidebar()" title="Collapse sidebar">
        <img id="collapse-icon" src="../assets/collapse.png" alt="Collapse" />
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn-back" onclick="window.location.href='service_management.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Back
      </button>

      <div class="user-profile" onclick="toggleDropdown(event)">
        <div class="user-info">
          <div class="user-name">Loading...</div>
          <div class="user-role">Admin ✓</div>
        </div>
        <div class="user-avatar">
          <img src="../assets/user_profile.png" alt="Admin profile" />
        </div>
        <div class="profile-dropdown" id="profile-dropdown">
          <button class="dd-item disabled" onclick="event.stopPropagation()">Edit Profile</button>
          <div class="dd-divider"></div>
          <button class="dd-item logout" onclick="handleSignOut(event)">Sign Out</button>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="header-group">
        <div class="title-area">
          <h2 id="page-title">Service List</h2>
          <p id="page-subtitle">Monitor and manage document processes.</p>
        </div>
      </div>

      <div class="actions-row">
        <div class="search-input-wrapper">
          <div class="search-icon-embed">
            <img src="../assets/search.png" alt="Search icon" />
          </div>
          <input type="text" id="search-input" placeholder="Search service..." aria-label="Search city office updates" oninput="filterServices(this.value)" />
        </div>

        <button type="button" class="btn-add-service" onclick="window.location.href='../Forms/add_service.html'">
          <img src="../assets/add_service.png" alt="Plus Icon" />
          <span>Add New Service</span>
        </button>
      </div>

      <div class="panel-card">
        <div class="services-scroll">
          <div class="services-grid" id="services-grid"></div>
          <p id="loading" style="text-align: center; color:#6b7a99; font-size:1rem; font-weight:600; margin-top:40px;">Loading services...</p>
          <p id="no-results" style="display:none; text-align:center; color:#6b7a99; font-size:1rem; font-weight:600; margin-top:40px;">No services found.</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '../Firebase/firebase-config.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    window.handleSignOut = async function(e) {
      e.stopPropagation();
      const overlay = document.createElement('div');
      overlay.innerHTML = '<div style="position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:9999;"><div style="background:#fff;border-radius:20px;padding:40px 36px 32px;text-align:center;max-width:360px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.2);"><div style="width:48px;height:48px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;"><div style="width:48px;height:48px;border:4px solid rgba(42,125,225,0.2);border-top-color:#2a7de1;border-radius:50%;animation:spin 0.7s linear infinite;"></div></div><div style="font-size:1.3rem;font-weight:800;color:#1a2540;margin-bottom:8px;">Signing Out...</div><div style="font-size:0.88rem;color:#555;">Please wait.</div></div></div>';
      document.body.appendChild(overlay);
      await signOut(auth);
      window.location.href = '../Authentication/auth.html';
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../Authentication/auth.html'; return; }
      let token = await user.getIdTokenResult();
      if (!token.claims.admin) {
        await new Promise(resolve => setTimeout(resolve, 2000));
        await user.getIdToken(true);
        token = await user.getIdTokenResult();
      }
      if (!token.claims.admin) {
        await auth.signOut();
        window.location.href = '../Authentication/auth.html';
      } else {
        document.querySelector('.user-name').textContent = user.displayName || user.email;
        document.querySelector('.user-role').textContent = 'Admin ✓';
      }
    });

    const params = new URLSearchParams(window.location.search);
    const currentOffice = params.get('office');

    if (currentOffice) {
      document.getElementById('page-title').textContent = currentOffice + " Services";
      document.getElementById('page-subtitle').textContent = `Monitor and manage service items listed under ${currentOffice}.`;
    }

    async function loadServices() {
      const listContainer = document.getElementById('services-grid');
      const loadingText = document.getElementById('loading');
      
      if (!currentOffice) {
        loadingText.innerText = 'No office selected.';
        return;
      }

      try {
        loadingText.style.display = 'block';

        const officesRef = collection(db, "offices");
        const officeQuery = query(officesRef, where("office_name", "==", currentOffice));
        const officeSnapshot = await getDocs(officeQuery);

        if (officeSnapshot.empty) {
          loadingText.innerText = 'Office not found in the database.';
          return;
        }

        const actualOfficeId = officeSnapshot.docs[0].id;
        
        const servicesRef = collection(db, "offices", actualOfficeId, "services");
        const querySnapshot = await getDocs(servicesRef);

        if (querySnapshot.empty) {
          loadingText.innerText = 'No services found for this office yet.';
          return;
        } else {
          loadingText.style.display = 'none';
        }

        querySnapshot.forEach((doc) => {
          const serviceData = doc.data();
          const serviceId = doc.id; 
          
          const serviceHTML = `
            <div class="service-card" onclick="openService('${serviceData.service_name || serviceId}')">
              <p class="card-title">${serviceData.service_name || serviceId}</p>
            </div>
          `;
          
          listContainer.insertAdjacentHTML('beforeend', serviceHTML);
        });

      } catch (error) {
        console.error("Error fetching services: ", error);
        loadingText.innerText = 'Failed to load services. Check your permissions.';
      }
    }

    loadServices();
  </script>
  
  <script>
    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('collapsed');
      const collapsed = document.querySelector('.sidebar').classList.contains('collapsed');
      const icon = document.getElementById('collapse-icon');
      icon.src = collapsed ? '../assets/collapse-right.png' : '../assets/collapse.png';
      icon.alt = collapsed ? 'Expand' : 'Collapse';
    }

    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById('profile-dropdown').classList.toggle('show');
    }
    document.addEventListener('click', () => {
      document.getElementById('profile-dropdown').classList.remove('show');
    });

    function filterServices(query) {
      const q = query.trim().toLowerCase();
      const cards = document.querySelectorAll('#services-grid .service-card');
      let visible = 0;
      cards.forEach(card => {
        const name = card.querySelector('p').textContent.toLowerCase();
        const show = name.includes(q);
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
    }
    
    function openService(name) {
      window.location.href = '../Forms/edit_service.html?service=' + encodeURIComponent(name);
    }
  </script>

</body>
</html>
